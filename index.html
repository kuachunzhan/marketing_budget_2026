<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Budget & Vendor Management 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen" x-data="budgetApp()" x-init="initApp()" x-cloak>

  <!-- 頂部導航列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-chart-pie text-lg"></i></div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight" x-text="lang === 'zh' ? '2026 行銷預算與廠商管理系統' : '2026 Marketing Budget & Vendor Hub'"></h1>
          <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '預算分配 • 支出追蹤 • 廠商三期排程' : 'Budget Allocation • Spend Tracker • Vendor Installments'"></p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button @click="showSyncModal = true" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border transition"
          :class="{
            'bg-emerald-50 text-emerald-700 border-emerald-200': syncStatus === 'synced',
            'bg-amber-50 text-amber-700 border-amber-200': syncStatus === 'syncing',
            'bg-rose-50 text-rose-700 border-rose-200': syncStatus === 'error',
            'bg-slate-100 text-slate-600 border-slate-200': syncStatus === 'offline'
          }">
          <span class="w-2 h-2 rounded-full"
            :class="{
              'bg-emerald-500 animate-pulse': syncStatus === 'synced',
              'bg-amber-500 animate-ping': syncStatus === 'syncing',
              'bg-rose-500': syncStatus === 'error',
              'bg-slate-400': syncStatus === 'offline'
            }"></span>
          <span x-text="getSyncStatusLabel()"></span>
        </button>

        <button @click="toggleLanguage()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200">
          <i class="fa-solid fa-globe mr-1"></i> <span x-text="lang === 'zh' ? 'EN' : '繁中'"></span>
        </button>
      </div>
    </div>

    <!-- 分頁切換 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 border-t border-slate-100 text-sm">
      <button @click="currentTab = 'overview'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'overview' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'"><span x-text="lang === 'zh' ? '預算總覽與分配' : 'Budget Overview'"></span></button>
      <button @click="currentTab = 'expenses'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'expenses' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'"><span x-text="lang === 'zh' ? '支出明細記錄' : 'Expenses Log'"></span></button>
      <button @click="currentTab = 'vendors'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'vendors' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'"><span x-text="lang === 'zh' ? '廠商付款與合約管理' : 'Vendor & Contract Hub'"></span></button>
    </div>
  </header>

  <!-- 核心指標 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '年度總預算' : 'Annual Budget'"></div>
        <div class="text-2xl font-bold text-slate-900 mt-1" x-text="formatVND(totalBudget)"></div>
        <div class="text-xs text-indigo-600 font-medium mt-1" x-text="`≈ ${formatNTD(totalBudget)}`"></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '已執行支出' : 'Total Spent'"></div>
        <div class="text-2xl font-bold text-emerald-600 mt-1" x-text="formatVND(totalSpent())"></div>
        <div class="text-xs text-slate-500 font-medium mt-1" x-text="`≈ ${formatNTD(totalSpent())}`"></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '剩餘可用' : 'Remaining'"></div>
        <div class="text-2xl font-bold mt-1 text-slate-900" x-text="formatVND(remainingBudget())"></div>
        <div class="text-xs text-slate-500 font-medium mt-1" x-text="`≈ ${formatNTD(remainingBudget())}`"></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '整體執行率' : 'Execution Rate'"></div>
        <div class="text-2xl font-bold text-indigo-600 mt-1" x-text="overallExecutionRate() + '%'"></div>
        <div class="w-full bg-slate-100 rounded-full h-2 mt-2">
          <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" :style="`width: ${Math.min(overallExecutionRate(), 100)}%`"></div>
        </div>
      </div>
    </div>

    <!-- TAB 1: 預算動態調整 -->
    <div x-show="currentTab === 'overview'" class="space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-5">
          <div class="flex justify-between items-center pb-3 border-b border-slate-100">
            <h2 class="font-bold text-slate-900 text-sm" x-text="lang === 'zh' ? '五大管道預算調配' : 'Budget Sliders'"></h2>
            <button @click="rebalanceEqually()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded font-medium">均分 20%</button>
          </div>
          <template x-for="(cat, idx) in categories" :key="cat.id">
            <div class="space-y-2 p-3 bg-slate-50 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs">
                <span class="font-bold text-slate-800" x-text="lang === 'zh' ? cat.name_zh : cat.name_en"></span>
                <div>
                  <span class="font-bold" x-text="formatVND(getCatAllocatedAmount(cat))"></span>
                  <span class="text-slate-400" x-text="`(${cat.percent}%)`"></span>
                </div>
              </div>
              <input type="range" min="0" max="100" step="1" x-model.number="cat.percent" @input="onSliderChange(idx)" class="w-full h-2 bg-slate-200 rounded accent-indigo-600">
            </div>
          </template>
        </div>
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
          <div class="w-full max-w-[260px]"><canvas id="budgetPieChart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- TAB 2: 支出清單 -->
    <div x-show="currentTab === 'expenses'" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-900 text-sm" x-text="lang === 'zh' ? '行銷支出明細' : 'Expenses'"></h2>
        <button @click="addDemoExpense()" class="px-3 py-1.5 bg-indigo-600 text-white rounded text-xs font-semibold">+ 新增模擬支出</button>
      </div>
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b">
          <tr><th class="p-3">專案</th><th class="p-3">類別</th><th class="p-3">廠商</th><th class="p-3">金額 (VND)</th><th class="p-3">日期</th></tr>
        </thead>
        <tbody>
          <template x-for="exp in expenses" :key="exp.id">
            <tr class="border-b">
              <td class="p-3 font-medium" x-text="exp.title"></td>
              <td class="p-3" x-text="getCatName(exp.category)"></td>
              <td class="p-3 text-indigo-600 font-semibold" x-text="exp.vendor"></td>
              <td class="p-3 font-bold" x-text="formatVND(exp.amount)"></td>
              <td class="p-3 text-slate-500" x-text="exp.date"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- TAB 3: 廠商管理 -->
    <div x-show="currentTab === 'vendors'" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="font-bold text-slate-900 text-sm" x-text="lang === 'zh' ? '廠商合約與分期撥款' : 'Vendors & Installments'"></h2>
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b">
          <tr><th class="p-3">廠商</th><th class="p-3">合約期程</th><th class="p-3">合約總額</th><th class="p-3">撥款狀態</th></tr>
        </thead>
        <tbody>
          <template x-for="v in vendors" :key="v.id">
            <tr class="border-b">
              <td class="p-3 font-bold text-slate-900" x-text="v.name"></td>
              <td class="p-3" x-text="`${v.startDate} ~ ${v.endDate}`"></td>
              <td class="p-3 font-bold" x-text="formatVND(v.totalContract)"></td>
              <td class="p-3">
                <template x-if="v.paymentType === '3_stage'">
                  <div class="flex space-x-1">
                    <template x-for="(inst, i) in v.installments" :key="i">
                      <button @click="toggleInstallment(v, i)" class="px-2 py-0.5 rounded text-[10px] font-semibold border"
                        :class="inst.paid ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-amber-50 text-amber-700 border-amber-300'">
                        <span x-text="`P${i+1}: `"></span>
                        <span x-text="inst.paid ? '已付' : '待付'"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="v.paymentType !== '3_stage'">
                  <button @click="toggleSingle(v)" class="px-2 py-0.5 rounded text-[10px] font-semibold"
                    :class="v.singlePaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                    x-text="v.singlePaid ? '已結清' : '待付款'"></button>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

  <!-- 雲端同步設定彈窗 -->
  <div x-show="showSyncModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-900 text-sm">Google Sheets 雲端連線設定</h3>
        <button @click="showSyncModal = false"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="text" x-model="syncUrl" class="w-full p-2 border rounded font-mono text-xs">
      <div class="flex justify-end space-x-2">
        <button @click="fetchCloudData(false)" class="px-4 py-2 bg-indigo-600 text-white rounded text-xs font-semibold">測試讀取</button>
        <button @click="pushDataToCloud()" class="px-4 py-2 bg-emerald-600 text-white rounded text-xs font-semibold">強制寫入雲端</button>
      </div>
    </div>
  </div>

  <script>
    function budgetApp() {
      return {
        lang: 'zh',
        currentTab: 'overview',
        showSyncModal: false,
        syncStatus: 'offline',
        syncUrl: 'https://script.google.com/macros/s/AKfycbwKZbvYp86RUWfEp2oC-_BAhO6z2iElYsH9ui3eoHi1jIHA0fxQ5T-3RCnqkyeYUIRtjg/exec',
        totalBudget: 8000000000,
        rate: 800,

        categories: [
          { id: 'social', name_zh: '社群媒體', name_en: 'Social Media', percent: 25 },
          { id: 'pr', name_zh: '公關傳播', name_en: 'PR', percent: 20 },
          { id: 'performance', name_zh: '成效廣告', name_en: 'Performance Ads', percent: 25 },
          { id: 'product', name_zh: '產品行銷', name_en: 'Product Marketing', percent: 15 },
          { id: 'offline', name_zh: '線下活動', name_en: 'Offline Events', percent: 15 }
        ],

        expenses: [
          { id: 1, title: 'KOL 社群專案', category: 'social', vendor: 'Media Star Agency', amount: 320000000, date: '2026-03-15' },
          { id: 2, title: 'Q1 成效廣告費', category: 'performance', vendor: 'Google Ads Ltd', amount: 480000000, date: '2026-03-20' }
        ],

        vendors: [
          {
            id: 1, name: 'Vietnam Event Pro', startDate: '2026-01-01', endDate: '2026-06-30', totalContract: 1200000000, paymentType: '3_stage',
            installments: [{ name: '訂金', amount: 360000000, paid: true }, { name: '期中款', amount: 480000000, paid: true }, { name: '尾款', amount: 360000000, paid: false }]
          },
          {
            id: 2, name: 'Google Ads Ltd', startDate: '2026-01-01', endDate: '2026-12-31', totalContract: 2000000000, paymentType: 'single', singlePaid: true
          }
        ],

        chartInstance: null,

        initApp() {
          this.$nextTick(() => {
            this.initChart();
            this.fetchCloudData(false);
          });
        },

        getSyncStatusLabel() {
          if (this.syncStatus === 'synced') return this.lang === 'zh' ? '雲端已同步' : 'Live Synced';
          if (this.syncStatus === 'syncing') return this.lang === 'zh' ? '同步中...' : 'Syncing...';
          if (this.syncStatus === 'error') return this.lang === 'zh' ? '連線逾時' : 'Timed out';
          return this.lang === 'zh' ? '單機模式' : 'Standalone';
        },

        fetchCloudData(silent = false) {
          if (!this.syncUrl) return;
          if (!silent) this.syncStatus = 'syncing';

          const callbackName = 'gas_cb_' + Math.round(100000 * Math.random());
          let isDone = false;

          // 6 秒逾時防禦機制
          const timer = setTimeout(() => {
            if (!isDone) {
              isDone = true;
              this.syncStatus = 'error';
              delete window[callbackName];
              const el = document.getElementById(callbackName);
              if (el) el.remove();
            }
          }, 6000);

          window[callbackName] = (res) => {
            if (isDone) return;
            isDone = true;
            clearTimeout(timer);
            if (res && res.status === 'success' && res.data) {
              const d = res.data;
              if (d.totalBudget) this.totalBudget = d.totalBudget;
              if (d.categories) this.categories = d.categories;
              if (d.expenses) this.expenses = d.expenses;
              if (d.vendors) this.vendors = d.vendors;
              this.syncStatus = 'synced';
              this.updateChart();
            } else {
              this.syncStatus = 'synced';
            }
            delete window[callbackName];
            const el = document.getElementById(callbackName);
            if (el) el.remove();
          };

          const script = document.createElement('script');
          script.id = callbackName;
          const sep = this.syncUrl.includes('?') ? '&' : '?';
          script.src = `${this.syncUrl}${sep}callback=${callbackName}&action=get&t=${Date.now()}`;
          script.onerror = () => {
            if (isDone) return;
            isDone = true;
            clearTimeout(timer);
            this.syncStatus = 'error';
          };
          document.body.appendChild(script);
        },

        pushDataToCloud() {
          const payload = {
            totalBudget: this.totalBudget,
            categories: this.categories,
            expenses: this.expenses,
            vendors: this.vendors
          };

          if (!this.syncUrl) return;
          this.syncStatus = 'syncing';

          fetch(this.syncUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          }).then(() => {
            setTimeout(() => { this.syncStatus = 'synced'; }, 800);
          }).catch(() => {
            this.syncStatus = 'error';
          });
        },

        formatVND(v) { return (v || 0).toLocaleString() + ' ₫'; },
        formatNTD(v) { return 'NT$ ' + Math.round((v || 0) / this.rate).toLocaleString(); },
        totalSpent() { return this.expenses.reduce((a, b) => a + (Number(b.amount) || 0), 0); },
        remainingBudget() { return this.totalBudget - this.totalSpent(); },
        overallExecutionRate() { return this.totalBudget ? Math.round((this.totalSpent() / this.totalBudget) * 100) : 0; },
        getCatAllocatedAmount(c) { return Math.round((this.totalBudget * (c.percent || 0)) / 100); },
        getCatName(id) {
          const c = this.categories.find(x => x.id === id);
          return c ? (this.lang === 'zh' ? c.name_zh : c.name_en) : id;
        },

        onSliderChange() { this.updateChart(); this.pushDataToCloud(); },
        rebalanceEqually() { this.categories.forEach(c => c.percent = 20); this.updateChart(); this.pushDataToCloud(); },
        toggleLanguage() { this.lang = this.lang === 'zh' ? 'en' : 'zh'; this.updateChart(); },
        toggleInstallment(v, i) { v.installments[i].paid = !v.installments[i].paid; this.pushDataToCloud(); },
        toggleSingle(v) { v.singlePaid = !v.singlePaid; this.pushDataToCloud(); },
        addDemoExpense() {
          this.expenses.push({ id: Date.now(), title: '新專案測試', category: 'social', vendor: 'Vietnam Event Pro', amount: 150000000, date: '2026-05-01' });
          this.updateChart();
          this.pushDataToCloud();
        },

        initChart() {
          const ctx = document.getElementById('budgetPieChart');
          if (!ctx) return;
          this.chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: this.categories.map(c => this.lang === 'zh' ? c.name_zh : c.name_en),
              datasets: [{ data: this.categories.map(c => c.percent), backgroundColor: ['#6366F1', '#EC4899', '#3B82F6', '#10B981', '#F59E0B'] }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
          });
        },
        updateChart() {
          if (!this.chartInstance) return;
          this.chartInstance.data.labels = this.categories.map(c => this.lang === 'zh' ? c.name_zh : c.name_en);
          this.chartInstance.data.datasets[0].data = this.categories.map(c => c.percent);
          this.chartInstance.update();
        }
      }
    }
  </script>
</body>
</html>
