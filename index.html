<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 行銷預算與廠商管理系統 | Marketing Budget & Vendor Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Alpine.js defer -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    [x-cloak] { display: none !important; }
    /* 客製化捲軸 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen" x-data="budgetApp()" x-init="initApp()" x-cloak>

  <!-- 權限登入驗證全螢幕遮罩 (Login Overlay) -->
  <div x-show="!isLoggedIn" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-6 border border-slate-100 text-center">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>
      <div>
        <h2 class="font-extrabold text-xl text-slate-900 leading-tight" x-text="lang === 'zh' ? '行銷預算管理系統存取驗證' : 'Marketing Budget Hub Access'"></h2>
        <p class="text-xs text-slate-500 mt-1.5" x-text="lang === 'zh' ? '請輸入存取通行密碼以解鎖並檢視儀表板數據' : 'Please enter access password to view dashboard'"></p>
      </div>

      <!-- 密碼輸入表單 -->
      <form @submit.prevent="attemptLogin()" class="space-y-4 text-left">
        <div>
          <label class="block font-semibold text-xs text-slate-700 mb-1.5" x-text="lang === 'zh' ? '系統通行密碼' : 'Access Password'"></label>
          <div class="relative">
            <input :type="showLoginPassword ? 'text' : 'password'" x-model="loginInputPassword" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
            <button type="button" @click="showLoginPassword = !showLoginPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid" :class="showLoginPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- 登入錯誤提示 -->
        <template x-if="loginError">
          <div class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span x-text="loginError"></span>
          </div>
        </template>

        <div class="flex items-center justify-between text-xs text-slate-500">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" x-model="rememberMe" class="rounded text-indigo-600 focus:ring-indigo-500">
            <span x-text="lang === 'zh' ? '保持登入狀態' : 'Remember me'"></span>
          </label>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition duration-150 flex items-center justify-center space-x-2">
          <i class="fa-solid fa-key"></i>
          <span x-text="lang === 'zh' ? '驗證並解鎖系統' : 'Unlock Dashboard'"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- 頂部導航列 (登入後顯示) -->
  <header x-show="isLoggedIn" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
          <i class="fa-solid fa-chart-pie text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight" x-text="lang === 'zh' ? '2026 行銷預算與廠商管理系統' : '2026 Marketing Budget & Vendor Hub'"></h1>
          <p class="text-xs text-slate-500 hidden sm:block" x-text="lang === 'zh' ? '預算分配 • 渠道監控 • 支出追蹤 • 廠商四種付款條件' : 'Budget Allocation • Channels • Spend Tracker • Flexible Vendor Terms'"></p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 變更密碼按鈕 -->
        <button @click="showChangePasswordModal = true" class="px-2.5 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition shadow-xs flex items-center space-x-1" title="變更系統通行密碼">
          <i class="fa-solid fa-lock text-slate-500"></i>
          <span class="hidden sm:inline" x-text="lang === 'zh' ? '變更密碼' : 'Password'"></span>
        </button>

        <!-- 重置預設預算按鈕 -->
        <button @click="resetToDefaultPreset()" class="px-2.5 py-1.5 text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg border border-rose-200 transition shadow-xs flex items-center space-x-1" title="若畫面資料異常，請點此還原">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="hidden sm:inline" x-text="lang === 'zh' ? '重置預設預算' : 'Reset Preset'"></span>
        </button>

        <!-- 雲端同步狀態標籤 -->
        <button @click="showSyncModal = true" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border transition shadow-xs"
          :class="{
            'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100': syncStatus === 'synced',
            'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100': syncStatus === 'syncing',
            'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100': syncStatus === 'error',
            'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200': syncStatus === 'offline'
          }">
          <span class="w-2 h-2 rounded-full"
            :class="{
              'bg-emerald-500 animate-pulse': syncStatus === 'synced',
              'bg-amber-500 animate-ping': syncStatus === 'syncing',
              'bg-rose-500': syncStatus === 'error',
              'bg-slate-400': syncStatus === 'offline'
            }"></span>
          <span x-text="getSyncStatusLabel()"></span>
        </button>

        <!-- 語言切換按鈕 -->
        <button @click="toggleLanguage()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition shadow-xs">
          <i class="fa-solid fa-globe mr-1"></i> <span x-text="lang === 'zh' ? 'EN' : '繁中'"></span>
        </button>

        <!-- 登出按鈕 -->
        <button @click="logout()" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition" title="登出系統">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>
    </div>

    <!-- 4 大核心分頁選單 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 sm:space-x-8 border-t border-slate-100 text-sm overflow-x-auto">
      <button @click="switchTab('overview')" class="py-3 font-medium border-b-2 whitespace-nowrap transition" :class="currentTab === 'overview' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-chart-line mr-1.5"></i><span x-text="lang === 'zh' ? '預算總覽與分配' : 'Budget Overview & Sliders'"></span>
      </button>
      <button @click="switchTab('channels')" class="py-3 font-medium border-b-2 whitespace-nowrap transition" :class="currentTab === 'channels' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-layer-group mr-1.5"></i><span x-text="lang === 'zh' ? '各渠道執行與剩餘預算' : 'Channel Performance & Remaining'"></span>
      </button>
      <button @click="switchTab('expenses')" class="py-3 font-medium border-b-2 whitespace-nowrap transition" :class="currentTab === 'expenses' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-receipt mr-1.5"></i><span x-text="lang === 'zh' ? '支出明細記錄' : 'Expenses Log'"></span>
      </button>
      <button @click="switchTab('vendors')" class="py-3 font-medium border-b-2 whitespace-nowrap transition" :class="currentTab === 'vendors' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-building-user mr-1.5"></i><span x-text="lang === 'zh' ? '廠商付款與合約管理' : 'Vendor & Contract Hub'"></span>
      </button>
    </div>
  </header>

  <!-- 主內容區 (登入後顯示) -->
  <main x-show="isLoggedIn" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- 頂部 4 大核心 KPI 統計卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- 年度總預算卡片 -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '年度總預算 (VND / NT$)' : 'Annual Total Budget (VND / NT$)'"></div>
          <div class="text-2xl font-black text-slate-900 mt-1" x-text="formatVND(totalBudget)"></div>
          <div class="text-xs text-indigo-600 font-semibold mt-0.5" x-text="`≈ ${formatNTD(totalBudget)}`"></div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
          <span class="text-slate-500" x-text="lang === 'zh' ? '預算調整：' : 'Adjust Budget:'"></span>
          <input type="number" x-model.number="totalBudget" @input="onTotalBudgetManualChange()" class="w-36 px-2 py-1 border border-slate-200 rounded text-right font-mono text-xs focus:ring-1 focus:ring-indigo-500 font-bold text-slate-800">
        </div>
      </div>

      <!-- 目前已分配預算卡片 -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '目前已分配預算' : 'Total Allocated Budget'"></div>
          <div class="text-2xl font-black text-indigo-600 mt-1" x-text="formatVND(totalAllocatedAmount())"></div>
          <div class="text-xs text-indigo-600/80 font-semibold mt-0.5" x-text="`≈ ${formatNTD(totalAllocatedAmount())}`"></div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500 font-medium">
          <span x-text="lang === 'zh' ? '分配比例：' : 'Allocated Share:'"></span>
          <span class="font-bold text-slate-800" x-text="`${totalAllocatedPercentage()}%`"></span>
        </div>
      </div>

      <!-- 實際已支出總額卡片 -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '實際已支出總額' : 'Actual Total Spent'"></div>
          <div class="text-2xl font-black text-rose-600 mt-1" x-text="formatVND(totalSpent())"></div>
          <div class="text-xs text-rose-500 font-semibold mt-0.5" x-text="`≈ ${formatNTD(totalSpent())}`"></div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500 font-medium">
          <span x-text="lang === 'zh' ? '執行進度：' : 'Execution Rate:'"></span>
          <span class="font-bold text-slate-800" x-text="`${overallExecutionRate()}%`"></span>
        </div>
      </div>

      <!-- 剩餘可用預算金額卡片 -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-500" x-text="lang === 'zh' ? '剩餘可預算金額' : 'Remaining Budget Available'"></div>
          <div class="text-2xl font-black text-emerald-600 mt-1" x-text="formatVND(remainingBudget())"></div>
          <div class="text-xs text-emerald-600/80 font-semibold mt-0.5" x-text="`≈ ${formatNTD(remainingBudget())}`"></div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500 font-medium">
          <span x-text="lang === 'zh' ? '狀態：' : 'Status:'"></span>
          <span class="font-bold text-emerald-600" x-text="remainingBudget() >= 0 ? (lang === 'zh' ? '預算充足' : 'Sufficient') : (lang === 'zh' ? '預算超支' : 'Overbudget')"></span>
        </div>
      </div>
    </div>

    <!-- TAB 1: 預算總覽與動態調配 (雙圖表 + 9 大渠道滑桿與數字編輯) -->
    <div x-show="currentTab === 'overview'" class="space-y-6">
      <!-- 雙圖表區塊：各管道預算分配比例 (Pie Chart) & 編列預算 vs 實際支出 (Bar Chart) -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 圓餅圖 -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col items-center">
          <h3 class="font-bold text-slate-900 text-sm mb-4 self-start" x-text="lang === 'zh' ? '各管道預算分配比例 (Pie Chart)' : 'Budget Allocation Share (Pie Chart)'"></h3>
          <div class="w-full max-w-[320px] aspect-square flex items-center justify-center">
            <canvas id="budgetPieChart"></canvas>
          </div>
        </div>

        <!-- 藍紅柱狀對比圖 -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col items-center">
          <h3 class="font-bold text-slate-900 text-sm mb-4 self-start" x-text="lang === 'zh' ? '編列預算 vs 實際支出 (Bar Chart)' : 'Allocated Budget vs Actual Spent (Bar Chart)'"></h3>
          <div class="w-full h-[300px]">
            <canvas id="budgetBarChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 下方：管道預算動態調配清單 -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-4 border-b border-slate-100">
          <div>
            <h2 class="font-bold text-slate-900 text-base" x-text="lang === 'zh' ? '動態預算金額與比例調配' : 'Dynamic Budget Allocation & Share'"></h2>
            <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '可直接手動修改編列預算數字，或拖曳滑桿即時動態計算與顯示比例' : 'Directly type allocated budget amounts or drag sliders to balance share'"></p>
          </div>
          <div class="flex items-center space-x-2">
            <button @click="openAddChannelModal()" class="px-3 py-1.5 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg font-semibold transition border border-indigo-200 shadow-xs">
              <i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'zh' ? '新增管道' : 'Add Channel'"></span>
            </button>
            <button @click="rebalanceEqually()" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition border border-slate-200">
              <i class="fa-solid fa-arrows-split-up-and-left mr-1"></i> <span x-text="lang === 'zh' ? '平均分配' : 'Equal Split'"></span>
            </button>
          </div>
        </div>

        <div class="space-y-4">
          <template x-for="(cat, idx) in categories" :key="cat.id">
            <div class="p-4 rounded-xl border border-slate-100 hover:border-indigo-100 transition bg-slate-50/50 space-y-2">
              <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full flex-shrink-0" :style="`background-color: ${cat.color}`"></span>
                  <span class="font-bold text-slate-900 text-sm" x-text="getCategoryLabel(cat)"></span>
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700" x-text="`${cat.percent}%`"></span>
                </div>

                <!-- 可直接編輯的編列預算金額輸入框 -->
                <div class="flex items-center space-x-2">
                  <span class="text-xs text-slate-500" x-text="lang === 'zh' ? '編列預算：' : 'Allocated:'"></span>
                  <input type="number" x-model.number="cat.amount" @input="onCatAmountChange(idx)" class="w-36 px-2.5 py-1 border border-slate-300 rounded-lg font-bold text-slate-900 text-right text-xs focus:ring-1 focus:ring-indigo-500">
                  <span class="text-xs font-semibold text-slate-600">₫</span>
                  <span class="text-[11px] text-slate-400 font-medium" x-text="`(${formatNTD(cat.amount)})`"></span>
                  <button @click="confirmDeleteCategory(idx)" class="text-slate-300 hover:text-rose-500 p-1 text-xs" title="刪除此管道"><i class="fa-regular fa-trash-can"></i></button>
                </div>
              </div>

              <!-- 滑桿 -->
              <input type="range" min="0" max="100" step="0.1" x-model.number="cat.percent" @input="onCatPercentChange(idx)" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">

              <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                <span>
                  <span x-text="lang === 'zh' ? '已實支：' : 'Spent: '"></span>
                  <strong class="text-slate-800" x-text="formatVND(getCatSpent(cat.id))"></strong>
                  <span class="text-[11px] text-slate-400" x-text="`(${getCatProgress(cat)}%)`"></span>
                </span>
                <span :class="getCatSpent(cat.id) > cat.amount ? 'text-rose-600 font-bold' : 'text-emerald-600 font-medium'"
                  x-text="getCatSpent(cat.id) > cat.amount ? (lang === 'zh' ? '已超支' : 'Overbudget') : (lang === 'zh' ? '正常執行' : 'Healthy')"></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- TAB 2: 各渠道執行與剩餘預算專屬頁面 -->
    <div x-show="currentTab === 'channels'" class="space-y-6">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <div>
          <h2 class="font-bold text-slate-900 text-base" x-text="lang === 'zh' ? '各行銷渠道預算執行與剩餘明細' : 'Channel Budget Execution & Remaining Breakdown'"></h2>
          <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '即時檢視每個渠道的編列金額、已支出金額、剩餘預算與健康狀態' : 'Track per-channel planned spend, actual spend, remaining budget, and status'"></p>
        </div>
      </div>

      <!-- 渠道卡片清單 (Grid Cards) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <template x-for="cat in categories" :key="cat.id">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between space-y-4">
            <div>
              <div class="flex justify-between items-start">
                <div class="flex items-center space-x-2">
                  <span class="w-3.5 h-3.5 rounded-full" :style="`background-color: ${cat.color}`"></span>
                  <h3 class="font-bold text-slate-900 text-sm" x-text="getCategoryLabel(cat)"></h3>
                </div>
                <span class="px-2 py-0.5 rounded text-[11px] font-bold"
                  :class="getCatSpent(cat.id) > cat.amount ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'"
                  x-text="getCatSpent(cat.id) > cat.amount ? (lang === 'zh' ? '已超支' : 'Overbudget') : (lang === 'zh' ? '正常' : 'Healthy')"></span>
              </div>

              <!-- 金額指標 -->
              <div class="mt-4 space-y-2 text-xs">
                <div class="flex justify-between">
                  <span class="text-slate-500" x-text="lang === 'zh' ? '編列預算：' : 'Budget:'"></span>
                  <span class="font-bold text-slate-800" x-text="formatVND(cat.amount)"></span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-500" x-text="lang === 'zh' ? '實際支出：' : 'Actual Spent:'"></span>
                  <span class="font-bold text-rose-600" x-text="formatVND(getCatSpent(cat.id))"></span>
                </div>
                <div class="flex justify-between pt-1 border-t border-slate-100">
                  <span class="text-slate-700 font-semibold" x-text="lang === 'zh' ? '剩餘可用：' : 'Remaining:'"></span>
                  <div class="text-right">
                    <span class="font-black" :class="(cat.amount - getCatSpent(cat.id)) < 0 ? 'text-rose-600' : 'text-emerald-600'" x-text="formatVND(cat.amount - getCatSpent(cat.id))"></span>
                    <div class="text-[10px] text-slate-400" x-text="`≈ ${formatNTD(cat.amount - getCatSpent(cat.id))}`"></div>
                  </div>
                </div>
              </div>

  <!-- 彈窗 3：新增行銷管道 -->
  <div x-show="showChannelModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">

  <div x-show="showSyncModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">

        <h3 class="font-bold text-slate-900 text-base flex items-center">
          <i class="fa-solid fa-cloud text-indigo-600 mr-2"></i> <span x-text="lang === 'zh' ? 'Google Sheets 雲端連線設定' : 'Google Sheets Sync Settings'"></span>

        <button @click="pushDataToCloud()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold text-xs transition">
          <i class="fa-solid fa-cloud-arrow-up mr-1"></i> <span x-text="lang === 'zh' ? '強制寫入雲端' : 'Push to Cloud'"></span>

  <!-- 客製刪除確認 Modal -->
  <div x-show="showDeleteConfirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 text-center">

        <p class="text-xs text-slate-500 mt-1" x-text="lang === 'zh' ? '此動作無法復原，請確認是否繼續。' : 'This action cannot be undone.'"></p>
      </div>
      <div class="flex justify-center space-x-2 pt-2">
        <button @click="showDeleteConfirmModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold" x-text="lang === 'zh' ? '取消' : 'Cancel'"></button>
        <button @click="executeDelete()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold" x-text="lang === 'zh' ? '確定刪除' : 'Delete'"></button>
      </div>
    </div>
  </div>

  <script>
    function budgetApp() {
      return {
        // 登入驗證相關狀態
        isLoggedIn: false,
        masterPassword: '2026mkt', // 預設系統密碼
        loginInputPassword: '',
        showLoginPassword: false,
        rememberMe: true,
        loginError: '',
        showChangePasswordModal: false,
        newMasterPassword: '',

        lang: 'zh',
        currentTab: 'overview',
        showSyncModal: false,
        showExpenseModal: false,
        showVendorModal: false,
        showChannelModal: false,
        showDeleteConfirmModal: false,
        deleteConfirmType: null,
        deleteConfirmId: null,
        
        syncStatus: 'offline',
        syncUrl: 'https://script.google.com/macros/s/AKfycbwKZbvYp86RUWfEp2oC-_BAhO6z2iElYsH9ui3eoHi1jIHA0fxQ5T-3RCnqkyeYUIRtjg/exec',
        
        // 基礎年度總預算 (27,618,684,000 ₫)
        totalBudget: 27618684000, 
        rate: 800, // 1 NT$ ≈ 800 VND

        categories: [],
        expenses: [],
        vendors: [],

        expenseForm: { id: null, title: '', category: 'performance', vendor: '', amount: 0, date: '' },
        vendorForm: {
          id: null, name: '', approvalNo: '', startDate: '2026-01-01', endDate: '2026-12-31', totalContract: 0, paymentType: '3_stage', singlePaid: false,
          installments: [
            { name: '訂金 30%', amount: 0, dueDate: '', paid: false },
            { name: '期中款 40%', amount: 0, dueDate: '', paid: false },
            { name: '尾款 30%', amount: 0, dueDate: '', paid: false }
          ]
        },
        channelForm: { name_zh: '', name_en: '', amount: 0, color: '#3B82F6' },

        pieChartInstance: null,
        barChartInstance: null,
        defaultColors: ['#4F46E5', '#EC4899', '#F59E0B', '#10B981', '#8B5CF6', '#06B6D4', '#22C55E', '#EF4444', '#6366F1', '#3B82F6'],

        getDefaultCategories() {
          return [
            { id: 'performance', name_zh: '成效廣告', name_en: 'Performance Ads', amount: 13085484000, percent: 47.4, color: '#4F46E5' },
            { id: 'social', name_zh: '社群媒體', name_en: 'Social Media', amount: 2349600000, percent: 8.5, color: '#EC4899' },
            { id: 'pr', name_zh: '公關活動', name_en: 'Public Relations', amount: 1660000000, percent: 6.0, color: '#F59E0B' },
            { id: 'product', name_zh: '產品行銷', name_en: 'Product Marketing', amount: 601584000, percent: 2.2, color: '#10B981' },
            { id: 'offline', name_zh: '線下活動', name_en: 'Offline Events', amount: 7420000000, percent: 26.9, color: '#8B5CF6' },
            { id: 'ooh', name_zh: '戶外廣告 (OOH)', name_en: 'Out of Home (OOH)', amount: 518400000, percent: 1.9, color: '#06B6D4' },
            { id: 'social_listening', name_zh: '社群追蹤', name_en: 'Social Listening', amount: 383616000, percent: 1.4, color: '#22C55E' },
            { id: 'itvc', name_zh: 'iTVC', name_en: 'iTVC', amount: 1600000000, percent: 5.8, color: '#EF4444' },
            { id: 'appsflyer', name_zh: 'Appsflyer', name_en: 'Appsflyer', amount: 3750000000, percent: 13.6, color: '#6366F1' }
          ];
        },

        sanitizeCategories(raw) {
          const defaults = this.getDefaultCategories();
          if (!Array.isArray(raw) || raw.length === 0) return defaults;
          
          return raw.map((c, i) => {
            const def = defaults[i] || {};
            const name_zh = c.name_zh || c.name || def.name_zh || (`管道 ${i + 1}`);
            const name_en = c.name_en || c.name || def.name_en || (`Channel ${i + 1}`);
            const amt = Number(c.amount) >= 0 ? Number(c.amount) : (def.amount || 0);
            const pct = Number(c.percent) >= 0 ? Number(c.percent) : (def.percent || 0);
            
            return {
              id: c.id || ('cat_' + i),
              name_zh: name_zh,
              name_en: name_en,
              amount: amt,
              percent: pct,
              color: c.color || def.color || this.defaultColors[i % this.defaultColors.length]
            };
          });
        },

        initApp() {
          // 1. 檢查自訂系統密碼
          const savedPass = localStorage.getItem('mkt_app_master_pwd_2026');
          if (savedPass) this.masterPassword = savedPass;

          // 2. 檢查登入 Session 狀態
          const authSession = sessionStorage.getItem('mkt_auth_logged_in_2026') || localStorage.getItem('mkt_auth_logged_in_2026');
          if (authSession === 'true') {
            this.isLoggedIn = true;
          }

          // 3. 讀取本地 State
          const localState = localStorage.getItem('mkt_budget_state_2026');
          if (localState) {
            try {
              const parsed = JSON.parse(localState);
              if (parsed.totalBudget) this.totalBudget = Number(parsed.totalBudget) || 27618684000;
              this.categories = this.sanitizeCategories(parsed.categories);
              if (parsed.expenses && Array.isArray(parsed.expenses)) this.expenses = parsed.expenses;
              if (parsed.vendors && Array.isArray(parsed.vendors)) this.vendors = parsed.vendors;
            } catch(e) {
              this.categories = this.getDefaultCategories();
            }
          } else {
            this.categories = this.getDefaultCategories();
          }

          this.$nextTick(() => {
            if (this.isLoggedIn) {
              this.initCharts();
              this.fetchCloudData(false);
            }
            setInterval(() => {
              if (this.isLoggedIn && this.syncUrl) this.fetchCloudData(true);
            }, 15000);
          });
        },

        // 登入驗證
        attemptLogin() {
          this.loginError = '';
          if (this.loginInputPassword === this.masterPassword) {
            this.isLoggedIn = true;
            if (this.rememberMe) {
              localStorage.setItem('mkt_auth_logged_in_2026', 'true');
            } else {
              sessionStorage.setItem('mkt_auth_logged_in_2026', 'true');
            }
            this.loginInputPassword = '';
            this.$nextTick(() => {
              this.initCharts();
              this.fetchCloudData(false);
            });
          } else {
            this.loginError = this.lang === 'zh' ? '通行密碼不正確，請重新輸入' : 'Invalid access password';
          }
        },

        logout() {
          this.isLoggedIn = false;
          localStorage.removeItem('mkt_auth_logged_in_2026');
          sessionStorage.removeItem('mkt_auth_logged_in_2026');
        },

        saveNewPassword() {
          if (!this.newMasterPassword) return;
          this.masterPassword = this.newMasterPassword;
          localStorage.setItem('mkt_app_master_pwd_2026', this.newMasterPassword);
          this.showChangePasswordModal = false;
          this.newMasterPassword = '';
        },

        resetToDefaultPreset() {
          localStorage.removeItem('mkt_budget_state_2026');
          this.totalBudget = 27618684000;
          this.categories = this.getDefaultCategories();
          this.updateCharts();
          this.pushDataToCloud();
        },

        switchTab(tab) {
          this.currentTab = tab;
          this.$nextTick(() => {
            if (tab === 'overview' || tab === 'channels') {
              this.initCharts();
            }
          });
        },

        getSyncStatusLabel() {
          if (this.syncStatus === 'synced') return this.lang === 'zh' ? '雲端已同步' : 'Live Synced';
          if (this.syncStatus === 'syncing') return this.lang === 'zh' ? '同步中...' : 'Syncing...';
          if (this.syncStatus === 'error') return this.lang === 'zh' ? '連線異常' : 'Sync Error';
          return this.lang === 'zh' ? '單機模式' : 'Standalone';
        },

        getPaymentTypeLabel(type) {
          if (type === '3_stage') return this.lang === 'zh' ? '分三期（比例可自行調配）' : '3-Stage Installments';
          if (type === 'monthly') return this.lang === 'zh' ? '月結' : 'Monthly Billing';
          if (type === 'single') return this.lang === 'zh' ? '一次付清' : 'Lump Sum / Single';
          if (type === 'milestone') return this.lang === 'zh' ? '依執行項目' : 'By Deliverable / Milestone';
          return type || '-';
        },

        fetchCloudData(silent = false) {
          if (!this.syncUrl || !this.isLoggedIn) return;
          if (!silent) this.syncStatus = 'syncing';

          const callbackName = 'gas_cb_' + Math.round(100000 * Math.random());
          let isDone = false;

          const timer = setTimeout(() => {
            if (!isDone) {
              isDone = true;
              this.syncStatus = 'synced';
              delete window[callbackName];
              const el = document.getElementById(callbackName);
              if (el) el.remove();
            }
          }, 6000);

          window[callbackName] = (res) => {
            if (isDone) return;
            isDone = true;
            clearTimeout(timer);
            if (res && res.status === 'success' && res.data) {
              const d = res.data;
              if (d.totalBudget) this.totalBudget = Number(d.totalBudget) || 27618684000;
              this.categories = this.sanitizeCategories(d.categories);
              if (d.expenses && Array.isArray(d.expenses)) this.expenses = d.expenses;
              if (d.vendors && Array.isArray(d.vendors)) this.vendors = d.vendors;
              this.syncStatus = 'synced';
              this.updateCharts();
            } else {
              this.syncStatus = 'synced';
            }
            delete window[callbackName];
            const el = document.getElementById(callbackName);
            if (el) el.remove();
          };

          const script = document.createElement('script');
          script.id = callbackName;
          const sep = this.syncUrl.includes('?') ? '&' : '?';
          script.src = `${this.syncUrl}${sep}callback=${callbackName}&action=get&t=${Date.now()}`;
          script.onerror = () => {
            if (isDone) return;
            isDone = true;
            clearTimeout(timer);
            this.syncStatus = 'synced';
          };
          document.body.appendChild(script);
        },

        pushDataToCloud() {
          const payload = {
            totalBudget: this.totalBudget,
            categories: this.categories,
            expenses: this.expenses,
            vendors: this.vendors
          };
          localStorage.setItem('mkt_budget_state_2026', JSON.stringify(payload));

          if (!this.syncUrl || !this.isLoggedIn) return;
          this.syncStatus = 'syncing';

          fetch(this.syncUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          }).then(() => {
            setTimeout(() => { this.syncStatus = 'synced'; }, 600);
          }).catch(() => {
            this.syncStatus = 'synced';
          });
        },

        // 計算輔助函式
        formatVND(v) { return (Number(v) || 0).toLocaleString('en-US') + ' ₫'; },
        formatNTD(v) { return 'NT$ ' + Math.round((Number(v) || 0) / this.rate).toLocaleString('en-US'); },
        totalSpent() { return this.expenses.reduce((a, b) => a + (Number(b.amount) || 0), 0); },
        totalAllocatedAmount() { return this.categories.reduce((a, b) => a + (Number(b.amount) || 0), 0); },
        totalAllocatedPercentage() {
          if (!this.totalBudget) return 0;
          return Number(((this.totalAllocatedAmount() / this.totalBudget) * 100).toFixed(1));
        },
        remainingBudget() { return this.totalBudget - this.totalSpent(); },
        overallExecutionRate() { return this.totalBudget ? Math.round((this.totalSpent() / this.totalBudget) * 100) : 0; },
        
        getCatSpent(catId) {
          return this.expenses.filter(e => e.category === catId).reduce((a, b) => a + (Number(b.amount) || 0), 0);
        },
        getCatProgress(cat) {
          return cat.amount ? Math.round((this.getCatSpent(cat.id) / cat.amount) * 100) : 0;
        },
        getCategoryLabel(c) {
          if (!c) return '';
          return this.lang === 'zh' ? (c.name_zh || c.name || c.id) : (c.name_en || c.name_zh || c.name || c.id);
        },
        getCatName(id) {
          const c = this.categories.find(x => x.id === id);
          return c ? this.getCategoryLabel(c) : id;
        },

        onTotalBudgetManualChange() {
          if (this.totalBudget > 0) {
            this.categories.forEach(c => {
              c.percent = Number(((c.amount / this.totalBudget) * 100).toFixed(1));
            });
          }
          this.updateCharts();
          this.pushDataToCloud();
        },
        onCatAmountChange(idx) {
          const c = this.categories[idx];
          if (this.totalBudget > 0) {
            c.percent = Number(((c.amount / this.totalBudget) * 100).toFixed(1));
          }
          this.updateCharts();
          this.pushDataToCloud();
        },
        onCatPercentChange(idx) {
          const c = this.categories[idx];
          c.amount = Math.round((this.totalBudget * c.percent) / 100);
          this.updateCharts();
          this.pushDataToCloud();
        },
        rebalanceEqually() {
          const count = this.categories.length;
          if (count === 0) return;
          const avgPct = Number((100 / count).toFixed(1));
          this.categories.forEach(c => {
            c.percent = avgPct;
            c.amount = Math.round((this.totalBudget * avgPct) / 100);
          });
          this.updateCharts();
          this.pushDataToCloud();
        },

        // 管道管理
        openAddChannelModal() {
          this.channelForm = { name_zh: '', name_en: '', amount: 0, color: '#3B82F6' };
          this.showChannelModal = true;
        },
        saveNewChannel() {
          if (!this.channelForm.name_zh) return;
          const newId = 'cat_' + Date.now();
          const amt = Number(this.channelForm.amount) || 0;
          const pct = this.totalBudget > 0 ? Number(((amt / this.totalBudget) * 100).toFixed(1)) : 0;
          this.categories.push({
            id: newId,
            name_zh: this.channelForm.name_zh,
            name_en: this.channelForm.name_en || this.channelForm.name_zh,
            amount: amt,
            percent: pct,
            color: this.channelForm.color || '#3B82F6'
          });
          this.showChannelModal = false;
          this.updateCharts();
          this.pushDataToCloud();
        },
        confirmDeleteCategory(idx) {
          this.deleteConfirmType = 'category';
          this.deleteConfirmId = idx;
          this.showDeleteConfirmModal = true;
        },

        // 支出管理
        openNewExpenseModal() {
          this.expenseForm = { id: null, title: '', category: this.categories[0] ? this.categories[0].id : 'performance', vendor: '', amount: 0, date: new Date().toISOString().split('T')[0] };
          this.showExpenseModal = true;
        },
        quickAddExpense(catId) {
          this.expenseForm = { id: null, title: '', category: catId, vendor: '', amount: 0, date: new Date().toISOString().split('T')[0] };
          this.showExpenseModal = true;
        },
        editExpense(exp) {
          this.expenseForm = JSON.parse(JSON.stringify(exp));
          this.showExpenseModal = true;
        },
        saveExpenseForm() {
          if (!this.expenseForm.title || !this.expenseForm.amount) return;
          if (this.expenseForm.id) {
            const idx = this.expenses.findIndex(e => e.id === this.expenseForm.id);
            if (idx !== -1) this.expenses[idx] = JSON.parse(JSON.stringify(this.expenseForm));
          } else {
            this.expenses.push({ ...this.expenseForm, id: Date.now() });
          }
          this.showExpenseModal = false;
          this.updateCharts();
          this.pushDataToCloud();
        },
        confirmDeleteExpense(id) {
          this.deleteConfirmType = 'expense';
          this.deleteConfirmId = id;
          this.showDeleteConfirmModal = true;
        },
        jumpToVendor(name) {
          if (!name) return;
          this.currentTab = 'vendors';
        },

        // 廠商管理
        openNewVendorModal() {
          this.vendorForm = {
            id: null, name: '', approvalNo: '', startDate: '2026-01-01', endDate: '2026-12-31', totalContract: 0, paymentType: '3_stage', singlePaid: false,
            installments: [
              { name: '訂金 30%', amount: 0, dueDate: '', paid: false },
              { name: '期中款 40%', amount: 0, dueDate: '', paid: false },
              { name: '尾款 30%', amount: 0, dueDate: '', paid: false }
            ]
          };
          this.showVendorModal = true;
        },
        editVendor(v) {
          this.vendorForm = JSON.parse(JSON.stringify(v));
          if (!this.vendorForm.installments || this.vendorForm.installments.length === 0) {
            this.vendorForm.installments = [
              { name: '訂金 30%', amount: 0, dueDate: '', paid: false },
              { name: '期中款 40%', amount: 0, dueDate: '', paid: false },
              { name: '尾款 30%', amount: 0, dueDate: '', paid: false }
            ];
          }
          this.showVendorModal = true;
        },
        onTotalContractChange() {
          if (this.vendorForm.paymentType === '3_stage') {
            this.autoSplitInstallments(30, 40, 30);
          }
        },
        autoSplitInstallments(p1, p2, p3) {
          const tot = Number(this.vendorForm.totalContract) || 0;
          if (!this.vendorForm.installments || this.vendorForm.installments.length < 3) {
            this.vendorForm.installments = [
              { name: '第一期', amount: 0, dueDate: '', paid: false },
              { name: '第二期', amount: 0, dueDate: '', paid: false },
              { name: '第三期', amount: 0, dueDate: '', paid: false }
            ];
          }
          this.vendorForm.installments[0].name = this.lang === 'zh' ? `第一期 ${p1}%` : `Stage 1 ${p1}%`;
          this.vendorForm.installments[0].amount = Math.round((tot * p1) / 100);
          this.vendorForm.installments[1].name = this.lang === 'zh' ? `第二期 ${p2}%` : `Stage 2 ${p2}%`;
          this.vendorForm.installments[1].amount = Math.round((tot * p2) / 100);
          this.vendorForm.installments[2].name = this.lang === 'zh' ? `第三期 ${p3}%` : `Stage 3 ${p3}%`;
          this.vendorForm.installments[2].amount = tot - this.vendorForm.installments[0].amount - this.vendorForm.installments[1].amount;
        },
        saveVendorForm() {
          if (!this.vendorForm.name) return;
          if (this.vendorForm.id) {
            const idx = this.vendors.findIndex(v => v.id === this.vendorForm.id);
            if (idx !== -1) this.vendors[idx] = JSON.parse(JSON.stringify(this.vendorForm));
          } else {
            this.vendors.push({ ...this.vendorForm, id: Date.now() });
          }
          this.showVendorModal = false;
          this.pushDataToCloud();
        },
        confirmDeleteVendor(id) {
          this.deleteConfirmType = 'vendor';
          this.deleteConfirmId = id;
          this.showDeleteConfirmModal = true;
        },

        executeDelete() {
          if (this.deleteConfirmType === 'category') {
            this.categories.splice(this.deleteConfirmId, 1);
            this.updateCharts();
            this.pushDataToCloud();
          } else if (this.deleteConfirmType === 'expense') {
            this.expenses = this.expenses.filter(e => e.id !== this.deleteConfirmId);
            this.updateCharts();
            this.pushDataToCloud();
          } else if (this.deleteConfirmType === 'vendor') {
            this.vendors = this.vendors.filter(v => v.id !== this.deleteConfirmId);
            this.pushDataToCloud();
          }
          this.showDeleteConfirmModal = false;
        },

        toggleInstallmentStatus(v, idx) {
          v.installments[idx].paid = !v.installments[idx].paid;
          this.pushDataToCloud();
        },
        toggleSingleStatus(v) {
          v.singlePaid = !v.singlePaid;
          this.pushDataToCloud();
        },

        // 合約預警 (90天)
        getExpiringVendors() {
          const now = new Date();
          return this.vendors.map(v => {
            const end = new Date(v.endDate);
            const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
            return { ...v, daysLeft: diffDays };
          }).filter(v => v.daysLeft <= 90);
        },
        getContractBadge(v) {
          const now = new Date();
          const end = new Date(v.endDate);
          const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
          if (diffDays < 0) return { class: 'bg-rose-100 text-rose-700', text: this.lang === 'zh' ? '已到期' : 'Expired' };
          if (diffDays <= 90) return { class: 'bg-amber-100 text-amber-700', text: this.lang === 'zh' ? `即將到期 (${diffDays}天)` : `Expiring (${diffDays}d)` };
          return { class: 'bg-emerald-100 text-emerald-700', text: this.lang === 'zh' ? '執行中' : 'Active' };
        },

        toggleLanguage() {
          this.lang = this.lang === 'zh' ? 'en' : 'zh';
          this.updateCharts();
        },

        // Chart.js 初始化與更新
        initCharts() {
          if (!this.isLoggedIn) return;
          // 1. 圓餅圖 (Pie Chart)
          const pieCtx = document.getElementById('budgetPieChart');
          if (pieCtx) {
            try {
              const existingPie = Chart.getChart(pieCtx);
              if (existingPie) existingPie.destroy();
              this.pieChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                  labels: this.categories.map(c => this.getCategoryLabel(c)),
                  datasets: [{
                    data: this.categories.map(c => Number(c.amount) || 0),
                    backgroundColor: this.categories.map(c => c.color || '#4F46E5')
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
                }
              });
            } catch(err) {}
          }

          // 2. 藍紅柱狀圖 (Bar Chart)
          const barCtx = document.getElementById('budgetBarChart');
          if (barCtx) {
            try {
              const existingBar = Chart.getChart(barCtx);
              if (existingBar) existingBar.destroy();
              this.barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                  labels: this.categories.map(c => this.getCategoryLabel(c)),
                  datasets: [
                    {
                      label: this.lang === 'zh' ? '編列預算' : 'Allocated Budget',
                      data: this.categories.map(c => Number(c.amount) || 0),
                      backgroundColor: '#4F46E5'
                    },
                    {
                      label: this.lang === 'zh' ? '實際支出' : 'Actual Spent',
                      data: this.categories.map(c => this.getCatSpent(c.id)),
                      backgroundColor: '#EF4444'
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    y: {
                      beginAtZero: true,
                      ticks: { callback: (val) => (val / 1000000000).toFixed(1) + 'B' }
                    }
                  },
                  plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
              });
            } catch(err) {}
          }
        },

        updateCharts() {
          if (!this.isLoggedIn) return;
          const labels = this.categories.map(c => this.getCategoryLabel(c));
          try {
            if (this.pieChartInstance) {
              this.pieChartInstance.data.labels = labels;
              this.pieChartInstance.data.datasets[0].data = this.categories.map(c => Number(c.amount) || 0);
              this.pieChartInstance.data.datasets[0].backgroundColor = this.categories.map(c => c.color || '#4F46E5');
              this.pieChartInstance.update();
            }
            if (this.barChartInstance) {
              this.barChartInstance.data.labels = labels;
              this.barChartInstance.data.datasets[0].label = this.lang === 'zh' ? '編列預算' : 'Allocated Budget';
              this.barChartInstance.data.datasets[0].data = this.categories.map(c => Number(c.amount) || 0);
              this.barChartInstance.data.datasets[1].label = this.lang === 'zh' ? '實際支出' : 'Actual Spent';
              this.barChartInstance.data.datasets[1].data = this.categories.map(c => this.getCatSpent(c.id));
              this.barChartInstance.update();
            }
          } catch(err) {
            this.initCharts();
          }
        }
      }
    }
  </script>
</body>
</html>
