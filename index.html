<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Budget & Vendor Management Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen" x-data="budgetApp()" x-init="initApp()" x-cloak>

    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight" x-text="t('行銷預算與廠商管理系統', 'Marketing Budget & Vendor System')"></h1>
                    <p class="text-xs text-slate-400" x-text="t('多管道預算調配 | 廠商三期撥款 | 合約到期追蹤', 'Multi-channel Allocation | 3-Stage Installments | Contract Expiry Track')"></p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Sync Status Badge -->
                <button @click="openCloudModal = true" class="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full border border-slate-700 hover:border-slate-500 transition bg-slate-800/80">
                    <span class="w-2 h-2 rounded-full" :class="{
                        'bg-emerald-400 animate-pulse': syncStatus === 'synced',
                        'bg-amber-400 animate-spin': syncStatus === 'syncing',
                        'bg-slate-500': syncStatus === 'offline'
                    }"></span>
                    <span class="font-medium" x-text="syncStatusText"></span>
                </button>

                <!-- Language Toggle -->
                <button @click="toggleLanguage()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                    <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                    <span x-text="lang === 'zh' ? 'English' : '繁體中文'"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Expiry Alert Notification Banner -->
        <template x-if="expiringVendors.length > 0">
            <div class="mb-6 p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-start gap-3">
                    <div class="p-2 bg-amber-100 text-amber-700 rounded-lg shrink-0 mt-0.5 sm:mt-0">
                        <i data-lucide="bell-ring" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-amber-900" x-text="t('合約即將到期預警（3 個月內）', 'Contract Expiry Warning (Within 90 Days)')"></h4>
                        <p class="text-xs text-amber-700 mt-0.5">
                            <span x-text="t('共有 ', 'There are ')"></span>
                            <span class="font-bold underline" x-text="expiringVendors.length"></span>
                            <span x-text="t(' 家合作廠商合約需評估續約或備置：', ' vendor contract(s) requiring renewal evaluation: ')"></span>
                            <span class="font-semibold" x-text="expiringVendors.map(v => v.name + ' (' + v.daysLeft + t('天)', 'd)')).join(', ')"></span>
                        </p>
                    </div>
                </div>
                <button @click="currentTab = 'vendors'" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-semibold shadow-sm transition shrink-0">
                    <span x-text="t('查看廠商列表', 'View Vendors')"></span>
                </button>
            </div>
        </template>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button @click="switchTab('dashboard')" :class="currentTab === 'dashboard' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="py-3 px-4 text-sm border-b-2 font-medium transition flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span x-text="t('預算總覽與調配', 'Budget Overview & Reallocation')"></span>
            </button>
            <button @click="switchTab('expenses')" :class="currentTab === 'expenses' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="py-3 px-4 text-sm border-b-2 font-medium transition flex items-center gap-2">
                <i data-lucide="receipt" class="w-4 h-4"></i>
                <span x-text="t('支出明細紀錄', 'Expense Transactions')"></span>
            </button>
            <button @click="switchTab('vendors')" :class="currentTab === 'vendors' ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="py-3 px-4 text-sm border-b-2 font-medium transition flex items-center gap-2">
                <i data-lucide="building-2" class="w-4 h-4"></i>
                <span x-text="t('廠商管理與撥款', 'Vendor Payment Management')"></span>
            </button>
        </div>

        <!-- TAB 1: Dashboard Overview & Reallocation -->
        <div x-show="currentTab === 'dashboard'" class="space-y-6">
            <!-- Metrics Cards Row -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Card 1: Annual Budget -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('年度總預算 (VND / NT$)', 'Annual Budget (VND / NT$)')"></div>
                    <div class="text-xl font-bold text-slate-900 mt-1" x-text="formatNumber(annualBudget) + ' ₫'"></div>
                    <div class="text-xs text-indigo-600 mt-1 font-medium" x-text="'≈ NT$ ' + formatNumber(vndToTwd(annualBudget))"></div>
                    <div class="mt-3 flex items-center text-xs gap-1 text-slate-500">
                        <span x-text="t('預算調整：', 'Edit Total: ')"></span>
                        <input type="number" step="100000000" x-model.number="annualBudget" @input="recalculateAllocations()" class="w-28 px-2 py-0.5 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-indigo-500 font-mono">
                    </div>
                </div>

                <!-- Card 2: Allocated Budget -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('目前已分配預算', 'Allocated Budget')"></div>
                    <div class="text-xl font-bold text-indigo-600 mt-1" x-text="formatNumber(totalAllocatedAmount) + ' ₫'"></div>
                    <div class="text-xs text-indigo-500 mt-1 font-medium" x-text="'≈ NT$ ' + formatNumber(vndToTwd(totalAllocatedAmount))"></div>
                    <div class="mt-3 text-xs text-slate-500">
                        <span x-text="t('分配比例：', 'Ratio: ')"></span>
                        <span class="font-bold text-slate-800" x-text="totalAllocatedPercentage + '%'"></span>
                    </div>
                </div>

                <!-- Card 3: Actual Spent -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('實際已支出總額', 'Actual Total Spent')"></div>
                    <div class="text-xl font-bold text-rose-600 mt-1" x-text="formatNumber(totalSpent) + ' ₫'"></div>
                    <div class="text-xs text-rose-500 mt-1 font-medium" x-text="'≈ NT$ ' + formatNumber(vndToTwd(totalSpent))"></div>
                    <div class="mt-3 text-xs text-slate-500">
                        <span x-text="t('執行進度：', 'Execution: ')"></span>
                        <span class="font-bold text-slate-800" x-text="overallExecutionRate + '%'"></span>
                    </div>
                </div>

                <!-- Card 4: Remaining Budget -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('剩餘可預算金額', 'Remaining Budget')"></div>
                    <div class="text-xl font-bold text-emerald-600 mt-1" x-text="formatNumber(remainingBudget) + ' ₫'"></div>
                    <div class="text-xs text-emerald-500 mt-1 font-medium" x-text="'≈ NT$ ' + formatNumber(vndToTwd(remainingBudget))"></div>
                    <div class="mt-3 text-xs text-slate-500">
                        <span x-text="t('狀態：', 'Status: ')"></span>
                        <span class="font-bold" :class="remainingBudget >= 0 ? 'text-emerald-600' : 'text-rose-600'" x-text="remainingBudget >= 0 ? t('預算充足', 'Healthy') : t('已超出總預算', 'Over Budget')"></span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Doughnut/Pie Chart -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-800 mb-4" x-text="t('各管道預算分配比例 (Pie Chart)', 'Budget Allocation Share (Pie Chart)')"></h3>
                    <div class="h-64 relative">
                        <canvas id="allocationPieChart"></canvas>
                    </div>
                </div>

                <!-- Comparison Bar Chart -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-800 mb-4" x-text="t('編列預算 vs 實際支出 (Bar Chart)', 'Budget vs Actual Spend (Bar Chart)')"></h3>
                    <div class="h-64 relative">
                        <canvas id="comparisonBarChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Dynamic Reallocation Sliders -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-base font-bold text-slate-800" x-text="t('動態預算比例調配 (Reallocation)', 'Dynamic Budget Allocation')"></h3>
                        <p class="text-xs text-slate-500 mt-0.5" x-text="t('拖曳滑桿即時調配五大行銷管道預算，圖表與數據同步算得', 'Drag sliders to redistribute budget across 5 channels in real-time')"></p>
                    </div>
                    <button @click="resetEqualShare()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
                        <span x-text="t('平均分配 (20%)', 'Balance (20%)')"></span>
                    </button>
                </div>

                <div class="space-y-5">
                    <template x-for="cat in categories" :key="cat.id">
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                            <div class="flex justify-between items-center text-sm">
                                <div class="flex items-center space-x-2">
                                    <span class="w-3 h-3 rounded-full" :style="'background-color:' + cat.color"></span>
                                    <span class="font-bold text-slate-800" x-text="t(cat.nameZh, cat.nameEn)"></span>
                                </div>
                                <div class="text-right">
                                    <span class="font-bold text-indigo-700 text-base" x-text="formatNumber(getCategoryBudget(cat.id)) + ' ₫'"></span>
                                    <span class="text-xs text-slate-400 ml-1" x-text="'(≈ NT$ ' + formatNumber(vndToTwd(getCategoryBudget(cat.id))) + ')'"></span>
                                </div>
                            </div>

                            <div class="flex items-center gap-4">
                                <input type="range" min="0" max="100" step="1" x-model.number="cat.percentage" @input="updateChartData(); saveState();" class="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg cursor-pointer">
                                <span class="w-12 text-right font-bold text-slate-700 text-sm" x-text="cat.percentage + '%'"></span>
                            </div>

                            <div class="flex justify-between items-center text-xs pt-1">
                                <div class="text-slate-500">
                                    <span x-text="t('已實支：', 'Spent: ')"></span>
                                    <span class="font-semibold text-slate-700" x-text="formatNumber(getCategorySpent(cat.id)) + ' ₫'"></span>
                                </div>
                                <div>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold" :class="getCategoryStatusClass(cat.id)" x-text="getCategoryStatusText(cat.id)"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- TAB 2: Expense Log -->
        <div x-show="currentTab === 'expenses'" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h3 class="text-base font-bold text-slate-800" x-text="t('行銷支出明細紀錄', 'Expense Transactions Log')"></h3>
                        <p class="text-xs text-slate-500 mt-0.5" x-text="t('所有實際發生的行銷費用與各廠商核銷狀況', 'Log and track all marketing spend and payment statuses')"></p>
                    </div>

                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <select x-model="selectedCategoryFilter" class="px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white text-slate-700 focus:ring-1 focus:ring-indigo-500">
                            <option value="ALL" x-text="t('所有管道類別', 'All Categories')"></option>
                            <template x-for="c in categories" :key="c.id">
                                <option :value="c.id" x-text="t(c.nameZh, c.nameEn)"></option>
                            </template>
                        </select>

                        <button @click="openExpenseModal = true" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5 shrink-0">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            <span x-text="t('新增支出紀錄', 'Add Expense')"></span>
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
                            <tr>
                                <th class="p-3" x-text="t('日期', 'Date')"></th>
                                <th class="p-3" x-text="t('項目名稱', 'Item / Title')"></th>
                                <th class="p-3" x-text="t('管道類別', 'Category')"></th>
                                <th class="p-3" x-text="t('合作廠商 (連動)', 'Vendor')"></th>
                                <th class="p-3" x-text="t('付款模式 / 期數', 'Payment Mode / Stage')"></th>
                                <th class="p-3 text-right" x-text="t('金額 (VND / NT$)', 'Amount')"></th>
                                <th class="p-3" x-text="t('撥款狀態', 'Payment')"></th>
                                <th class="p-3 text-center" x-text="t('操作', 'Action')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="item in filteredExpenses" :key="item.id">
                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="p-3 text-slate-500 whitespace-nowrap" x-text="item.date"></td>
                                    <td class="p-3 font-semibold text-slate-800" x-text="item.title"></td>
                                    <td class="p-3">
                                        <span class="px-2 py-0.5 rounded text-[11px] font-medium" :style="'background-color:' + getCategoryColor(item.categoryId) + '20; color:' + getCategoryColor(item.categoryId)" x-text="getCategoryName(item.categoryId)"></span>
                                    </td>
                                    <td class="p-3">
                                        <template x-if="item.vendorId">
                                            <button @click="jumpToVendor(item.vendorId)" class="text-indigo-600 hover:underline font-medium" x-text="getVendorName(item.vendorId)"></button>
                                        </template>
                                        <template x-if="!item.vendorId">
                                            <span class="text-slate-400" x-text="t('無指定廠商', 'Direct Spend')"></span>
                                        </template>
                                    </td>
                                    <td class="p-3">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700" x-text="getPaymentModeLabel(item)"></span>
                                    </td>
                                    <td class="p-3 text-right font-bold text-slate-800">
                                        <div x-text="formatNumber(item.amount) + ' ₫'"></div>
                                        <div class="text-[10px] text-slate-400 font-normal" x-text="'≈ NT$ ' + formatNumber(vndToTwd(item.amount))"></div>
                                    </td>
                                    <td class="p-3">
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold cursor-pointer" @click="toggleExpensePaymentStatus(item)" :class="item.paymentStatus === 'PAID' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'" x-text="item.paymentStatus === 'PAID' ? t('已結清', 'Paid') : t('待核銷', 'Pending')"></span>
                                    </td>
                                    <td class="p-3 text-center">
                                        <button @click="deleteExpense(item.id)" class="text-slate-400 hover:text-rose-600 transition">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: Vendors & Contracts -->
        <div x-show="currentTab === 'vendors'" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('合作廠商總數', 'Total Vendors')"></div>
                    <div class="text-2xl font-bold text-slate-900 mt-1" x-text="vendors.length"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('已撥付廠商總額', 'Vendor Total Paid')"></div>
                    <div class="text-xl font-bold text-emerald-600 mt-1" x-text="formatNumber(vendorPaidTotal) + ' ₫'"></div>
                    <div class="text-xs text-emerald-500 mt-1" x-text="'≈ NT$ ' + formatNumber(vndToTwd(vendorPaidTotal))"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium" x-text="t('待付合約尾款/未結額', 'Vendor Pending Total')"></div>
                    <div class="text-xl font-bold text-amber-600 mt-1" x-text="formatNumber(vendorPendingTotal) + ' ₫'"></div>
                    <div class="text-xs text-amber-500 mt-1" x-text="'≈ NT$ ' + formatNumber(vndToTwd(vendorPendingTotal))"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h3 class="text-base font-bold text-slate-800" x-text="t('廠商付款與合約管理', 'Vendor Payment & Contracts')"></h3>
                        <p class="text-xs text-slate-500 mt-0.5" x-text="t('支援三期彈性付款、按月請款、一次付清與 90 天合約到期提醒', 'Flexible payment terms & 90-day contract expiration warnings')"></p>
                    </div>

                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <input type="text" x-model="vendorSearchQuery" :placeholder="t('搜尋廠商名稱/聯絡人...', 'Search vendor...')" class="px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white text-slate-700 w-full sm:w-48">
                        <button @click="openVendorModal = true" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5 shrink-0">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span x-text="t('新增廠商', 'Add Vendor')"></span>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="v in filteredVendors" :key="v.id">
                        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200/80 hover:border-indigo-300 transition space-y-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-bold text-slate-900 text-base" x-text="v.name"></h4>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold" :class="getContractBadgeClass(v.contractEndDate)" x-text="getContractBadgeText(v.contractEndDate)"></span>
                                    </div>
                                    <p class="text-xs text-slate-500 mt-1">
                                        <span x-text="t('主要服務：', 'Category: ')"></span>
                                        <span class="font-medium text-slate-700" x-text="getCategoryName(v.categoryId)"></span>
                                    </p>
                                </div>
                                <span class="px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold" x-text="getPaymentTermBadgeText(v.paymentTerms)"></span>
                            </div>

                            <div class="text-xs text-slate-500 bg-white p-2.5 rounded-lg border border-slate-100 flex justify-between">
                                <div>
                                    <span class="text-slate-400" x-text="t('合約起迄：', 'Contract Term: ')"></span>
                                    <span class="font-medium text-slate-700" x-text="(v.contractStartDate || 'N/A') + ' ~ ' + (v.contractEndDate || 'N/A')"></span>
                                </div>
                            </div>

                            <!-- Installments Schedule Summary -->
                            <template x-if="v.paymentTerms === 'THREE_STAGE' || v.paymentTerms === 'THREE_STAGE_CUSTOM'">
                                <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100/80 space-y-2">
                                    <div class="flex justify-between items-center text-xs font-bold text-indigo-900">
                                        <span x-text="t('三期撥款排程進度', '3-Stage Payment Schedule')"></span>
                                        <button @click="openInstallmentConfig(v)" class="text-indigo-600 hover:underline text-[11px]" x-text="t('調整排程/核銷', 'Adjust / Settle')"></button>
                                    </div>

                        installments: [
                            { stage: 1, amount: 400000000, dueDate: '2026-03-05', status: 'PAID' },
                            { stage: 2, amount: 200000000, dueDate: '2026-05-01', status: 'PENDING' },
                            { stage: 3, amount: 200000000, dueDate: '2026-06-30', status: 'PENDING' }
                        ]
                    }
                ],

                expenses: [
                    { id: 'EXP-001', title: 'Q1 Meta & Google Search Ads', categoryId: 'ADS', vendorId: 'V-101', paymentMode: 'THREE_STAGE', installmentStage: 1, amount: 840000000, date: '2026-01-15', paymentStatus: 'PAID' },
                    { id: 'EXP-002', title: 'Q2 Meta Ads Phase 2 Deposit', categoryId: 'ADS', vendorId: 'V-101', paymentMode: 'THREE_STAGE', installmentStage: 2, amount: 1120000000, date: '2026-05-15', paymentStatus: 'PAID' },
                    { id: 'EXP-003', title: 'IG & TikTok Influencer Sponsorships', categoryId: 'SOCIAL', vendorId: '', paymentMode: 'LUMP_SUM', installmentStage: 1, amount: 600000000, date: '2026-02-20', paymentStatus: 'PAID' },
                    { id: 'EXP-004', title: 'Saigon Expo Offline Booth Setup', categoryId: 'EVENT', vendorId: 'V-103', paymentMode: 'THREE_STAGE_CUSTOM', installmentStage: 1, amount: 400000000, date: '2026-03-05', paymentStatus: 'PAID' }
                ],

                newExpense: {
                    title: '',
                    categoryId: 'ADS',
                    vendorId: '',
                    paymentMode: 'LUMP_SUM',
                    installmentStage: 1,
                    amount: 0,
                    date: new Date().toISOString().split('T')[0],
                    paymentStatus: 'PAID'
                },

                newVendor: {
                    name: '',
                    categoryId: 'ADS',
                    contactName: '',
                    email: '',
                    paymentTerms: 'THREE_STAGE',
                    stage1Pct: 30,
                    stage2Pct: 40,
                    stage3Pct: 30,
                    contractAmount: 0,
                    contractStartDate: '',
                    contractEndDate: ''
                },

                allocationChart: null,
                comparisonChart: null,

                // Helper: Bilingual Translation
                t(zh, en) {
                    return this.lang === 'zh' ? zh : en;
                },

                toggleLanguage() {
                    this.lang = this.lang === 'zh' ? 'en' : 'zh';
                    this.updateChartData();
                },

                switchTab(tab) {
                    this.currentTab = tab;
                    if (tab === 'dashboard') {
                        this.$nextTick(() => { this.updateChartData(); });
                    }
                },

                // Currency Helpers
                vndToTwd(vnd) {
                    return Math.round((Number(vnd) || 0) / 800);
                },

                formatNumber(val) {
                    return (Number(val) || 0).toLocaleString('en-US');
                },

                formatCompactNumber(val) {
                    const num = Number(val) || 0;
                    if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
                    if (num >= 1000000) return (num / 1000000).toFixed(0) + 'M';
                    return num.toLocaleString('en-US');
                },

                // Getters
                get totalAllocatedAmount() {
                    return Math.round((this.annualBudget * this.totalAllocatedPercentage) / 100);
                },

                get totalAllocatedPercentage() {
                    return this.categories.reduce((sum, c) => sum + (Number(c.percentage) || 0), 0);
                },

                get totalSpent() {
                    return this.expenses.filter(e => e.paymentStatus === 'PAID').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                },

                get overallExecutionRate() {
                    if (!this.annualBudget) return 0;
                    return Math.round((this.totalSpent / this.annualBudget) * 100);
                },

                get remainingBudget() {
                    return this.annualBudget - this.totalSpent;
                },

                get syncStatusText() {
                    if (this.syncStatus === 'synced') return this.t('🟢 雲端已同步', '🟢 Live Synced');
                    if (this.syncStatus === 'syncing') return this.t('🟡 同步中...', '🟡 Syncing...');
                    return this.t('⚪ 離線模式', '⚪ Standalone');
                },

                get expiringVendors() {
                    const now = new Date();
                    return this.vendors.map(v => {
                        if (!v.contractEndDate) return { ...v, daysLeft: 999 };
                        const end = new Date(v.contractEndDate);
                        const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
                        return { ...v, daysLeft: diffDays };
                    }).filter(v => v.daysLeft <= 90);
                },

                get filteredExpenses() {
                    if (this.selectedCategoryFilter === 'ALL') return this.expenses;
                    return this.expenses.filter(e => e.categoryId === this.selectedCategoryFilter);
                },

                get filteredVendors() {
                    if (!this.vendorSearchQuery) return this.vendors;
                    const q = this.vendorSearchQuery.toLowerCase();
                    return this.vendors.filter(v => v.name.toLowerCase().includes(q) || (v.contactName && v.contactName.toLowerCase().includes(q)));
                },

                get vendorPaidTotal() {
                    return this.expenses.filter(e => e.vendorId && e.paymentStatus === 'PAID').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                },

                get vendorPendingTotal() {
                    const totalContractSum = this.vendors.reduce((sum, v) => sum + (Number(v.contractAmount) || 0), 0);
                    return Math.max(0, totalContractSum - this.vendorPaidTotal);
                },

                // Category Helpers
                getCategoryBudget(catId) {
                    const cat = this.categories.find(c => c.id === catId);
                    if (!cat) return 0;
                    return Math.round((this.annualBudget * (cat.percentage || 0)) / 100);
                },

                getCategorySpent(catId) {
                    return this.expenses.filter(e => e.categoryId === catId && e.paymentStatus === 'PAID').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                },

                getCategoryProgressRate(catId) {
                    const budget = this.getCategoryBudget(catId);
                    if (!budget) return 0;
                    return Math.round((this.getCategorySpent(catId) / budget) * 100);
                },

                getCategoryStatusClass(catId) {
                    const rate = this.getCategoryProgressRate(catId);
                    if (rate > 100) return 'bg-rose-100 text-rose-700';
                    if (rate >= 80) return 'bg-amber-100 text-amber-700';
                    return 'bg-emerald-100 text-emerald-700';
                },

                getCategoryStatusText(catId) {
                    const rate = this.getCategoryProgressRate(catId);
                    if (rate > 100) return this.t('已超支', 'Over Budget');
                    if (rate >= 80) return this.t('接近上限', 'Near Limit');
                    return this.t('正常執行', 'Healthy');
                },

                getCategoryColor(catId) {
                    const c = this.categories.find(item => item.id === catId);
                    return c ? c.color : '#6366f1';
                },

                getCategoryName(catId) {
                    const c = this.categories.find(item => item.id === catId);
                    return c ? this.t(c.nameZh, c.nameEn) : catId;
                },

                getVendorName(vendorId) {
                    const v = this.vendors.find(item => item.id === vendorId);
                    return v ? v.name : 'N/A';
                },

                getPaymentTermBadgeText(termKey) {
                    if (termKey === 'THREE_STAGE') return this.t('分三期 (30/40/30)', '3-Stage (30/40/30)');
                    if (termKey === 'THREE_STAGE_CUSTOM') return this.t('分三期 (彈性比例)', '3-Stage (Custom)');
                    if (termKey === 'MONTHLY') return this.t('按月請款', 'Monthly');
                    return this.t('一次付清', 'Lump Sum');
                },

                getPaymentModeLabel(item) {
                    if (item.paymentMode === 'THREE_STAGE' || item.paymentMode === 'THREE_STAGE_CUSTOM') {
                        const stageNum = item.installmentStage || 1;
                        const stageNames = [this.t('1期 (頭款)', 'Stage 1'), this.t('2期 (期中款)', 'Stage 2'), this.t('3期 (尾款)', 'Stage 3')];
                        return this.t('分三期 - ', '3-Stage: ') + stageNames[stageNum - 1];
                    }
                    if (item.paymentMode === 'MONTHLY') return this.t('按月請款', 'Monthly');
                    return this.t('一次付清', 'Lump Sum');
                },

                getContractBadgeClass(endDate) {
                    if (!endDate) return 'bg-slate-100 text-slate-600';
                    const now = new Date();
                    const end = new Date(endDate);
                    const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) return 'bg-rose-100 text-rose-700';
                    if (diffDays <= 90) return 'bg-amber-100 text-amber-700';
                    return 'bg-emerald-100 text-emerald-700';
                },

                getContractBadgeText(endDate) {
                    if (!endDate) return 'N/A';
                    const now = new Date();
                    const end = new Date(endDate);
                    const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) return this.t('合約已到期', 'Expired');
                    if (diffDays <= 90) return this.t(`即將到期 (${diffDays}天)`, `Expiring (${diffDays}d)`);
                    return this.t('履約中', 'Active');
                },

                // Event Handlers
                onExpenseVendorChange() {
                    if (!this.newExpense.vendorId) return;
                    const v = this.vendors.find(item => item.id === this.newExpense.vendorId);
                    if (v) {
                        this.newExpense.categoryId = v.categoryId || this.newExpense.categoryId;
                        this.newExpense.paymentMode = v.paymentTerms || 'LUMP_SUM';
                        if (v.paymentTerms === 'THREE_STAGE' || v.paymentTerms === 'THREE_STAGE_CUSTOM') {
                            this.newExpense.installmentStage = 1;
                            this.onExpenseStageChange();
                        } else {
                            if (!this.newExpense.amount) this.newExpense.amount = v.contractAmount || 0;
                        }
                    }
                },

                onExpenseStageChange() {
                    if (!this.newExpense.vendorId) return;
                    const v = this.vendors.find(item => item.id === this.newExpense.vendorId);
                    if (v && (v.paymentTerms === 'THREE_STAGE' || v.paymentTerms === 'THREE_STAGE_CUSTOM') && v.installments) {
                        const stageIdx = (this.newExpense.installmentStage || 1) - 1;
                        if (v.installments[stageIdx]) {
                            this.newExpense.amount = v.installments[stageIdx].amount || 0;
                            const stageLabels = [this.t('第一期頭款', 'Stage 1 Deposit'), this.t('第二期期中款', 'Stage 2 Mid'), this.t('第三期尾款', 'Stage 3 Final')];
                            this.newExpense.title = v.name + ' - ' + stageLabels[stageIdx];
                        }
                    }
                },

                toggleExpensePaymentStatus(item) {
                    item.paymentStatus = item.paymentStatus === 'PAID' ? 'PENDING' : 'PAID';
                    if (item.vendorId && (item.paymentMode === 'THREE_STAGE' || item.paymentMode === 'THREE_STAGE_CUSTOM') && item.installmentStage) {
                        const v = this.vendors.find(vend => vend.id === item.vendorId);
                        if (v && v.installments && v.installments[item.installmentStage - 1]) {
                            v.installments[item.installmentStage - 1].status = item.paymentStatus;
                        }
                    }
                    this.saveState();
                    this.updateChartData();
                },

                toggleVendorStagePaid(vendor, stageIndex) {
                    if (!vendor.installments || !vendor.installments[stageIndex]) return;
                    const currentStatus = vendor.installments[stageIndex].status;
                    const newStatus = currentStatus === 'PAID' ? 'PENDING' : 'PAID';
                    vendor.installments[stageIndex].status = newStatus;

                    const matchedExp = this.expenses.find(e => e.vendorId === vendor.id && e.installmentStage === (stageIndex + 1));
                    if (matchedExp) {
                        matchedExp.paymentStatus = newStatus;
                    }
                    this.saveState();
                    this.updateChartData();
                },

                isVendorFullyPaid(vendor) {
                    if (vendor.paymentTerms === 'THREE_STAGE' || vendor.paymentTerms === 'THREE_STAGE_CUSTOM') {
                        return vendor.installments && vendor.installments.every(i => i.status === 'PAID');
                    }
                    const totalVendorSpent = this.expenses.filter(e => e.vendorId === vendor.id && e.paymentStatus === 'PAID').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                    return totalVendorSpent >= vendor.contractAmount && vendor.contractAmount > 0;
                },

                saveExpense() {
                    if (!this.newExpense.title || !this.newExpense.amount) return;
                    this.expenses.push({
                        id: 'EXP-' + Date.now(),
                        ...this.newExpense
                    });

                    if (this.newExpense.vendorId && (this.newExpense.paymentMode === 'THREE_STAGE' || this.newExpense.paymentMode === 'THREE_STAGE_CUSTOM') && this.newExpense.installmentStage) {
                        const v = this.vendors.find(item => item.id === this.newExpense.vendorId);
                        if (v && v.installments && v.installments[this.newExpense.installmentStage - 1]) {
                            v.installments[this.newExpense.installmentStage - 1].status = this.newExpense.paymentStatus;
                        }
                    }

                    this.openExpenseModal = false;
                    this.newExpense = { title: '', categoryId: 'ADS', vendorId: '', paymentMode: 'LUMP_SUM', installmentStage: 1, amount: 0, date: new Date().toISOString().split('T')[0], paymentStatus: 'PAID' };
                    this.saveState();
                    this.updateChartData();
                },

                deleteExpense(id) {
                    this.expenses = this.expenses.filter(e => e.id !== id);
                    this.saveState();
                    this.updateChartData();
                },

                saveVendor() {
                    if (!this.newVendor.name) return;
                    const contractAmt = Number(this.newVendor.contractAmount) || 0;
                    const isThreeStage = this.newVendor.paymentTerms === 'THREE_STAGE' || this.newVendor.paymentTerms === 'THREE_STAGE_CUSTOM';

                    let p1 = 0.3, p2 = 0.4, p3 = 0.3;
                    if (this.newVendor.paymentTerms === 'THREE_STAGE_CUSTOM') {
                        p1 = (Number(this.newVendor.stage1Pct) || 0) / 100;
                        p2 = (Number(this.newVendor.stage2Pct) || 0) / 100;
                        p3 = (Number(this.newVendor.stage3Pct) || 0) / 100;
                    }

                    const amt1 = Math.round(contractAmt * p1);
                    const amt2 = Math.round(contractAmt * p2);
                    const amt3 = contractAmt - amt1 - amt2;

                    this.vendors.push({
                        id: 'V-' + Date.now(),
                        ...this.newVendor,
                        isInstallment: isThreeStage,
                        installments: isThreeStage ? [
                            { stage: 1, amount: amt1, dueDate: '', status: 'PENDING' },
                            { stage: 2, amount: amt2, dueDate: '', status: 'PENDING' },
                            { stage: 3, amount: amt3, dueDate: '', status: 'PENDING' }
                        ] : []
                    });
                    this.openVendorModal = false;
                    this.newVendor = { name: '', categoryId: 'ADS', contactName: '', email: '', paymentTerms: 'THREE_STAGE', stage1Pct: 30, stage2Pct: 40, stage3Pct: 30, contractAmount: 0, contractStartDate: '', contractEndDate: '' };
                    this.saveState();
                },

                deleteVendor(id) {
                    this.vendors = this.vendors.filter(v => v.id !== id);
                    this.saveState();
                },

                jumpToVendor(vendorId) {
                    const v = this.vendors.find(item => item.id === vendorId);
                    if (v) {
                        this.vendorSearchQuery = v.name;
                        this.currentTab = 'vendors';
                    }
                },

                openInstallmentConfig(vendor) {
                    this.activeVendorForInstallment = vendor;
                    this.openInstallmentModal = true;
                },

                toggleInstallmentMode(vendor) {
                    vendor.isInstallment = !vendor.isInstallment;
                    if (vendor.isInstallment && (!vendor.installments || vendor.installments.length === 0)) {
                        const amt = vendor.contractAmount || 0;
                        vendor.installments = [
                            { stage: 1, amount: Math.round(amt * 0.3), dueDate: '', status: 'PENDING' },
                            { stage: 2, amount: Math.round(amt * 0.4), dueDate: '', status: 'PENDING' },
                            { stage: 3, amount: Math.round(amt * 0.3), dueDate: '', status: 'PENDING' }
                        ];
                    }
                    this.saveState();
                },

                recalculateAllocations() {
                    this.updateChartData();
                    this.saveState();
                },

                resetEqualShare() {
                    this.categories.forEach(c => c.percentage = 20);
                    this.updateChartData();
                    this.saveState();
                },

                saveState() {
                    const state = {
                        annualBudget: this.annualBudget,
                        categories: this.categories,
                        expenses: this.expenses,
                        vendors: this.vendors
                    };
                    localStorage.setItem('mkt_dashboard_state', JSON.stringify(state));
                },

                syncWithCloud() {
                    if (!this.googleSheetUrl) return;
                    this.syncStatus = 'syncing';
                    
                    fetch(this.googleSheetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            annualBudget: this.annualBudget,
                            categories: this.categories,
                            expenses: this.expenses,
                            vendors: this.vendors
                        })
                    }).then(() => {
                        setTimeout(() => { this.syncStatus = 'synced'; }, 600);
                    }).catch(() => {
                        this.syncStatus = 'offline';
                    });
                },

                initApp() {
                    const saved = localStorage.getItem('mkt_dashboard_state');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (parsed.annualBudget) this.annualBudget = parsed.annualBudget;
                            if (parsed.categories) this.categories = parsed.categories;
                            if (parsed.expenses) this.expenses = parsed.expenses;
                            if (parsed.vendors) this.vendors = parsed.vendors;
                        } catch(e) {}
                    }

                    this.$nextTick(() => {
                        if (window.lucide) lucide.createIcons();
                        this.initCharts();
                    });
                },

                initCharts() {
                    const pieCtx = document.getElementById('allocationPieChart');
                    const barCtx = document.getElementById('comparisonBarChart');

                    if (!pieCtx || !barCtx) return;

                    const existingPie = Chart.getChart(pieCtx);
                    if (existingPie) existingPie.destroy();

                    const existingBar = Chart.getChart(barCtx);
                    if (existingBar) existingBar.destroy();

                    this.allocationChart = new Chart(pieCtx, {
                        type: 'doughnut',
                        data: {
                            labels: this.categories.map(c => this.t(c.nameZh, c.nameEn)),
                            datasets: [{
                                data: this.categories.map(c => this.getCategoryBudget(c.id)),
                                backgroundColor: this.categories.map(c => c.color),
                                borderWidth: 2,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: { font: { family: 'Inter', size: 11 }, usePointStyle: true }
                                }
                            }
                        }
                    });

                    this.comparisonChart = new Chart(barCtx, {
                        type: 'bar',
                        data: {
                            labels: this.categories.map(c => this.t(c.nameZh, c.nameEn)),
                            datasets: [
                                {
                                    label: this.t('編列預算', 'Budgeted'),
                                    data: this.categories.map(c => this.getCategoryBudget(c.id)),
                                    backgroundColor: '#6366f1',
                                    borderRadius: 4
                                },
                                {
                                    label: this.t('實際支出', 'Actual Spend'),
                                    data: this.categories.map(c => this.getCategorySpent(c.id)),
                                    backgroundColor: '#f43f5e',
                                    borderRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: { font: { family: 'Inter', size: 11 }, usePointStyle: true }
                                }
                            },
                            scales: {
                                y: {
                                    ticks: {
                                        callback: function(value) {
                                            if (value >= 1000000000) return (value / 1000000000) + 'B';
                                            if (value >= 1000000) return (value / 1000000) + 'M';
                                            return value;
                                        },
                                        font: { family: 'Inter', size: 10 }
                                    },
                                    grid: { color: '#f1f5f9' }
                                },
                                x: {
                                    ticks: { font: { family: 'Inter', size: 11 } },
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                },

                updateChartData() {
                    if (!this.allocationChart || !this.comparisonChart) {
                        this.initCharts();
                        return;
                    }

                    try {
                        this.allocationChart.data.labels = this.categories.map(c => this.t(c.nameZh, c.nameEn));
                        this.allocationChart.data.datasets[0].data = this.categories.map(c => this.getCategoryBudget(c.id));
                        this.allocationChart.update();

                        this.comparisonChart.data.labels = this.categories.map(c => this.t(c.nameZh, c.nameEn));
                        this.comparisonChart.data.datasets[0].label = this.t('編列預算', 'Budgeted');
                        this.comparisonChart.data.datasets[0].data = this.categories.map(c => this.getCategoryBudget(c.id));
                        this.comparisonChart.data.datasets[1].label = this.t('實際支出', 'Actual Spend');
                        this.comparisonChart.data.datasets[1].data = this.categories.map(c => this.getCategorySpent(c.id));
                        this.comparisonChart.update();
                    } catch (err) {
                        this.initCharts();
                    }
                }
            };
        }
    </script>
</body>
</html>
