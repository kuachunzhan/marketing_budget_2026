<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Budget & Vendor Management 2026</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen" x-data="budgetApp()" x-init="initApp()" x-cloak>

  <!-- 頂部導航列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-chart-pie text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight" x-text="lang === 'zh' ? '2026 行銷預算與廠商管理系統' : '2026 Marketing Budget & Vendor Hub'"></h1>
          <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '預算分配 • 支出追蹤 • 廠商三期排程' : 'Budget Allocation • Spend Tracker • Vendor Installments'"></p>
        </div>
      </div>

      <!-- 狀態與工具列 -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <!-- 雲端同步狀態標籤 -->
        <button @click="showSyncModal = true" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors"
          :class="{
            'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100': syncStatus === 'synced',
            'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100': syncStatus === 'syncing',
            'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200': syncStatus === 'offline'
          }">
          <span class="w-2 h-2 rounded-full"
            :class="{
              'bg-emerald-500 animate-pulse': syncStatus === 'synced',
              'bg-amber-500 animate-spin': syncStatus === 'syncing',
              'bg-slate-400': syncStatus === 'offline'
            }"></span>
          <span x-text="getSyncStatusLabel()"></span>
        </button>

        <!-- 中英文切換按鈕 -->
        <button @click="toggleLanguage()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition">
          <i class="fa-solid fa-globe mr-1"></i> <span x-text="lang === 'zh' ? 'EN' : '繁中'"></span>
        </button>
      </div>
    </div>

    <!-- 分頁選單 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 border-t border-slate-100 text-sm">
      <button @click="currentTab = 'overview'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'overview' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-chart-line mr-1.5"></i><span x-text="lang === 'zh' ? '預算總覽與分配' : 'Budget Overview & Sliders'"></span>
      </button>
      <button @click="currentTab = 'expenses'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'expenses' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-receipt mr-1.5"></i><span x-text="lang === 'zh' ? '支出明細記錄' : 'Expenses Log'"></span>
      </button>
      <button @click="currentTab = 'vendors'" class="py-3 font-medium border-b-2 transition" :class="currentTab === 'vendors' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'">
        <i class="fa-solid fa-building-user mr-1.5"></i><span x-text="lang === 'zh' ? '廠商付款與合約管理' : 'Vendor & Contract Hub'"></span>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- 頂部核心總覽指標 (KPI Cards) -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="lang === 'zh' ? '年度總預算' : 'Annual Total Budget'"></div>
        <div class="text-2xl font-bold text-slate-900 mt-2" x-text="formatVND(totalBudget)"></div>
        <div class="text-xs text-indigo-600 font-medium mt-1" x-text="`≈ ${formatNTD(totalBudget)}`"></div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="lang === 'zh' ? '已執行總支出' : 'Total Spent'"></div>
        <div class="text-2xl font-bold text-emerald-600 mt-2" x-text="formatVND(totalSpent())"></div>
        <div class="text-xs text-slate-500 font-medium mt-1" x-text="`≈ ${formatNTD(totalSpent())}`"></div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="lang === 'zh' ? '剩餘可用預算' : 'Remaining Budget'"></div>
        <div class="text-2xl font-bold mt-2" :class="remainingBudget() < 0 ? 'text-rose-600' : 'text-slate-900'" x-text="formatVND(remainingBudget())"></div>
        <div class="text-xs text-slate-500 font-medium mt-1" x-text="`≈ ${formatNTD(remainingBudget())}`"></div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="lang === 'zh' ? '整體執行率' : 'Overall Execution Rate'"></div>
        <div class="text-2xl font-bold text-indigo-600 mt-2" x-text="overallExecutionRate() + '%'"></div>
        <div class="w-full bg-slate-100 rounded-full h-2 mt-2">
          <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" :style="`width: ${Math.min(overallExecutionRate(), 100)}%`"></div>
        </div>
      </div>
    </div>

    <!-- TAB 1: 預算總覽與分配 -->
    <div x-show="currentTab === 'overview'" class="space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 左側：五大分類動態分配滑桿 -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <div>
              <h2 class="font-bold text-slate-900 text-base" x-text="lang === 'zh' ? '行銷管道預算動態調配' : 'Dynamic Marketing Budget Allocation'"></h2>
              <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '拖曳滑桿即時分配五大類別年度預算比例' : 'Drag sliders to rebalance allocation weights in real-time'"></p>
            </div>
            <button @click="rebalanceEqually()" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">
              <i class="fa-solid fa-arrows-split-up-and-left mr-1"></i> <span x-text="lang === 'zh' ? '均分 20%' : 'Balance 20%'"></span>
            </button>
          </div>

          <div class="space-y-5">
            <template x-for="(cat, index) in categories" :key="cat.id">
              <div class="space-y-2 p-3 rounded-lg border border-slate-100 hover:border-indigo-100 transition bg-slate-50/50">
                <div class="flex justify-between items-center text-sm">
                  <span class="font-semibold text-slate-800" x-text="lang === 'zh' ? cat.name_zh : cat.name_en"></span>
                  <div class="text-right">
                    <span class="font-bold text-slate-900" x-text="formatVND(getCatAllocatedAmount(cat))"></span>
                    <span class="text-xs text-slate-400 ml-1" x-text="`(${cat.percent}%)`"></span>
                    <div class="text-[11px] text-slate-500" x-text="`≈ ${formatNTD(getCatAllocatedAmount(cat))}`"></div>
                  </div>
                </div>
                <input type="range" min="0" max="100" step="1" x-model.number="cat.percent" @input="onSliderChange(index)" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                  <span><span x-text="lang === 'zh' ? '已支：' : 'Spent: '"></span><strong class="text-slate-700" x-text="formatVND(getCatSpent(cat.id))"></strong></span>
                  <span :class="getCatSpent(cat.id) > getCatAllocatedAmount(cat) ? 'text-rose-600 font-bold' : 'text-emerald-600'" x-text="`${lang === 'zh' ? '進度：' : 'Progress: '}${getCatProgress(cat)}%`"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 右側：圓餅圖視覺化 -->
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
          <h3 class="font-bold text-slate-900 text-sm mb-4 self-start" x-text="lang === 'zh' ? '預算分配佔比 (Pie Chart)' : 'Allocation Distribution'"></h3>
          <div class="w-full max-w-[280px]">
            <canvas id="budgetPieChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: 支出明細記錄 -->
    <div x-show="currentTab === 'expenses'" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="font-bold text-slate-900 text-base" x-text="lang === 'zh' ? '行銷支出清單' : 'Expense Transactions'"></h2>
          <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '點擊廠商名稱可直接跳轉至廠商付款管理' : 'Click vendor name to jump directly to vendor payment hub'"></p>
        </div>
        <button @click="openNewExpenseModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
          <i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'zh' ? '新增支出' : 'Add Expense'"></span>
        </button>
      </div>

      <div class="overflow-x-auto border border-slate-100 rounded-lg">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
            <tr>
              <th class="px-4 py-3" x-text="lang === 'zh' ? '專案 / 項目名稱' : 'Project / Title'"></th>
              <th class="px-4 py-3" x-text="lang === 'zh' ? '行銷類別' : 'Category'"></th>
              <th class="px-4 py-3" x-text="lang === 'zh' ? '合作廠商' : 'Vendor'"></th>
              <th class="px-4 py-3" x-text="lang === 'zh' ? '金額 (VND / NTD)' : 'Amount'"></th>
              <th class="px-4 py-3" x-text="lang === 'zh' ? '支出日期' : 'Date'"></th>
              <th class="px-4 py-3 text-right" x-text="lang === 'zh' ? '操作' : 'Action'"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <template x-for="exp in expenses" :key="exp.id">
              <tr class="hover:bg-slate-50/80 transition">
                <td class="px-4 py-3 font-medium text-slate-900" x-text="exp.title"></td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium text-[11px]" x-text="getCatName(exp.category)"></span></td>
                <td class="px-4 py-3">
                  <button @click="jumpToVendor(exp.vendor)" class="text-indigo-600 hover:underline font-medium" x-text="exp.vendor || '-'"></button>
                </td>
                <td class="px-4 py-3">
                  <div class="font-bold text-slate-800" x-text="formatVND(exp.amount)"></div>
                  <div class="text-[10px] text-slate-400" x-text="`≈ ${formatNTD(exp.amount)}`"></div>
                </td>
                <td class="px-4 py-3 text-slate-500" x-text="exp.date"></td>
                <td class="px-4 py-3 text-right">
                  <button @click="deleteExpense(exp.id)" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-regular fa-trash-can"></i></button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 3: 廠商付款與合約管理 -->
    <div x-show="currentTab === 'vendors'" class="space-y-6">
      <!-- 合約即將到期提醒橫幅 (90天內) -->
      <template x-if="getExpiringVendors().length > 0">
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start space-x-3 text-amber-800 text-xs">
          <i class="fa-solid fa-triangle-exclamation text-base text-amber-600 mt-0.5"></i>
          <div>
            <div class="font-bold mb-1" x-text="lang === 'zh' ? '合約到期預警提示 (90 天內到期)' : 'Contract Expiry Alerts (< 90 Days)'"></div>
            <div class="space-x-2">
              <template x-for="v in getExpiringVendors()" :key="v.id">
                <span class="inline-block bg-amber-100 px-2 py-0.5 rounded font-medium text-[11px] mb-1">
                  <strong x-text="v.name"></strong>: <span x-text="lang === 'zh' ? `尚餘 ${v.daysLeft} 天到期 (${v.endDate})` : `${v.daysLeft} days left (${v.endDate})`"></span>
                </span>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- 廠商列表與三期排程 -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <h2 class="font-bold text-slate-900 text-base" x-text="lang === 'zh' ? '合作廠商名冊與三期付款進度' : 'Vendor Directory & Installment Tracker'"></h2>
            <p class="text-xs text-slate-500" x-text="lang === 'zh' ? '管理各廠商合約期程、付款條件與分期款項' : 'Manage contract terms, payment milestones and due dates'"></p>
          </div>
          <button @click="openNewVendorModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
            <i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'zh' ? '新增廠商' : 'Add Vendor'"></span>
          </button>
        </div>

        <div class="overflow-x-auto border border-slate-100 rounded-lg">
          <table class="w-full text-left text-xs text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
              <tr>
                <th class="px-4 py-3" x-text="lang === 'zh' ? '廠商名稱' : 'Vendor'"></th>
                <th class="px-4 py-3" x-text="lang === 'zh' ? '合約期間' : 'Contract Period'"></th>
                <th class="px-4 py-3" x-text="lang === 'zh' ? '合約總額' : 'Contract Total'"></th>
                <th class="px-4 py-3" x-text="lang === 'zh' ? '付款條件' : 'Terms'"></th>
                <th class="px-4 py-3" x-text="lang === 'zh' ? '撥款進度 / 三期狀態' : 'Installments / Status'"></th>
                <th class="px-4 py-3 text-right" x-text="lang === 'zh' ? '操作' : 'Action'"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <template x-for="v in vendors" :key="v.id">
                <tr class="hover:bg-slate-50/80 transition">
                  <td class="px-4 py-3 font-semibold text-slate-900" x-text="v.name"></td>
                  <td class="px-4 py-3">
                    <div x-text="`${v.startDate} ~ ${v.endDate}`"></div>
                    <span class="inline-block mt-0.5 px-1.5 py-0.5 rounded text-[10px] font-semibold"
                      :class="getContractBadge(v).class" x-text="getContractBadge(v).text"></span>
                  </td>
                  <td class="px-4 py-3">
                    <div class="font-bold text-slate-800" x-text="formatVND(v.totalContract)"></div>
                    <div class="text-[10px] text-slate-400" x-text="`≈ ${formatNTD(v.totalContract)}`"></div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-medium text-[11px]" x-text="v.paymentType === '3_stage' ? (lang === 'zh' ? '三期分期' : '3-Stage') : (lang === 'zh' ? '單期付清' : 'Full / Net')"></span>
                  </td>
                  <!-- 分期撥款狀態標籤 -->
                  <td class="px-4 py-3">
                    <template x-if="v.paymentType === '3_stage'">
                      <div class="flex items-center space-x-1">
                        <template x-for="(inst, i) in v.installments" :key="i">
                          <button @click="toggleInstallmentStatus(v, i)" class="px-2 py-0.5 rounded text-[10px] font-medium border transition"
                            :class="inst.paid ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-amber-50 text-amber-700 border-amber-300'"
                            :title="`${inst.name}: ${formatVND(inst.amount)}`">
                            <span x-text="`P${i+1}: `"></span>
                            <span x-text="inst.paid ? (lang === 'zh' ? '已付' : 'Paid') : (lang === 'zh' ? '待付' : 'Due')"></span>
                          </button>
                        </template>
                      </div>
                    </template>
                    <template x-if="v.paymentType !== '3_stage'">
                      <button @click="toggleSingleStatus(v)" class="px-2.5 py-1 rounded text-[11px] font-semibold transition"
                        :class="v.singlePaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                        x-text="v.singlePaid ? (lang === 'zh' ? '全額已付清' : 'Fully Paid') : (lang === 'zh' ? '尚未撥款' : 'Pending')">
                      </button>
                    </template>
                  </td>
                  <td class="px-4 py-3 text-right">
                    <button @click="editVendor(v)" class="text-indigo-600 hover:text-indigo-800 p-1 mr-1"><i class="fa-regular fa-pen-to-square"></i></button>
                    <button @click="deleteVendor(v.id)" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-regular fa-trash-can"></i></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- 雲端同步設定彈窗 -->
  <div x-show="showSyncModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-base flex items-center">
          <i class="fa-solid fa-cloud text-indigo-600 mr-2"></i> <span x-text="lang === 'zh' ? 'Google Sheets 雲端連線同步' : 'Google Sheets Cloud Sync'"></span>
        </h3>
        <button @click="showSyncModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Google Apps Script Web App URL</label>
          <input type="text" x-model="syncUrl" class="w-full px-3 py-2 border rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500">
        </div>
        <p class="text-slate-500 leading-relaxed" x-text="lang === 'zh' ? '系統支援多人即時協作與自動定時同步，所有變更將自動同步至 Google 試算表。' : 'Supports multi-user real-time syncing and automatic cloud updates directly to Google Sheets.'"></p>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
        <button @click="forceSyncFromCloud()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold text-xs transition">
          <i class="fa-solid fa-arrows-rotate mr-1"></i> <span x-text="lang === 'zh' ? '立即測試同步' : 'Sync Now'"></span>
        </button>
        <button @click="showSyncModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">
          <span x-text="lang === 'zh' ? '完成' : 'Close'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心狀態與連線邏輯 -->
  <script>
    function budgetApp() {
      return {
        lang: 'zh',
        currentTab: 'overview',
        showSyncModal: false,
        syncStatus: 'offline', // 'synced' | 'syncing' | 'offline'
        syncUrl: 'https://script.google.com/macros/s/AKfycbwKZbvYp86RUWfEp2oC-_BAhO6z2iElYsH9ui3eoHi1jIHA0fxQ5T-3RCnqkyeYUIRtjg/exec',
        totalBudget: 8000000000, // 80 億 VND (≈ 10,000,000 NT$)
        rate: 800, // 1 NT$ ≈ 800 VND

        categories: [
          { id: 'social', name_zh: '社群媒體 (Social)', name_en: 'Social Media', percent: 25 },
          { id: 'pr', name_zh: '公關傳播 (PR)', name_en: 'Public Relations', percent: 20 },
          { id: 'performance', name_zh: '成效廣告 (Ads)', name_en: 'Performance Ads', percent: 25 },
          { id: 'product', name_zh: '產品行銷 (Product)', name_en: 'Product Marketing', percent: 15 },
          { id: 'offline', name_zh: '線下活動 (Events)', name_en: 'Offline Events', percent: 15 }
        ],

        expenses: [
          { id: 1, title: 'KOL 社群推廣專案', category: 'social', vendor: 'Media Star Agency', amount: 320000000, date: '2026-03-15' },
          { id: 2, title: 'Q1 搜尋與成效廣告費', category: 'performance', vendor: 'Google Ads Ltd', amount: 480000000, date: '2026-03-20' },
          { id: 3, title: 'Hilton  Saigon 實體論壇活動', category: 'offline', vendor: 'Vietnam Event Pro', amount: 640000000, date: '2026-04-10' }
        ],

        vendors: [
          {
            id: 1,
            name: 'Vietnam Event Pro',
            startDate: '2026-01-01',
            endDate: '2026-06-30',
            totalContract: 1200000000,
            paymentType: '3_stage',
            installments: [
              { name: '訂金 30%', amount: 360000000, paid: true },
              { name: '期中款 40%', amount: 480000000, paid: true },
              { name: '尾款 30%', amount: 360000000, paid: false }
            ]
          },
          {
            id: 2,
            name: 'Media Star Agency',
            startDate: '2026-02-01',
            endDate: '2026-09-30',
            totalContract: 800000000,
            paymentType: '3_stage',
            installments: [
              { name: '第一期 50%', amount: 400000000, paid: true },
              { name: '第二期 30%', amount: 240000000, paid: false },
              { name: '第三期 20%', amount: 160000000, paid: false }
            ]
          },
          {
            id: 3,
            name: 'Google Ads Ltd',
            startDate: '2026-01-01',
            endDate: '2026-12-31',
            totalContract: 2000000000,
            paymentType: 'single',
            singlePaid: true
          }
        ],

        chartInstance: null,

        initApp() {
          // 嘗試從 LocalStorage 載入歷史資料
          const localState = localStorage.getItem('mkt_budget_state_2026');
          if (localState) {
            try {
              const parsed = JSON.parse(localState);
              if (parsed.totalBudget) this.totalBudget = parsed.totalBudget;
              if (parsed.categories) this.categories = parsed.categories;
              if (parsed.expenses) this.expenses = parsed.expenses;
              if (parsed.vendors) this.vendors = parsed.vendors;
            } catch(e) {}
          }

          this.$nextTick(() => {
            this.initChart();
            // 自動啟動雲端同步
            this.forceSyncFromCloud();
            // 每 15 秒背景輪詢最新資料
            setInterval(() => {
              if (this.syncUrl) this.fetchCloudData(true);
            }, 15000);
          });
        },

        // 雲端連線與同步方法
        getSyncStatusLabel() {
          if (this.syncStatus === 'synced') return this.lang === 'zh' ? '雲端已同步' : 'Live Synced';
          if (this.syncStatus === 'syncing') return this.lang === 'zh' ? '同步中...' : 'Syncing...';
          return this.lang === 'zh' ? '單機模式' : 'Standalone';
        },

        // 使用 JSONP 機制讀取 Google Sheet 雲端資料 (100% 避開 CORS 阻擋)
        fetchCloudData(silent = false) {
          if (!this.syncUrl) return;
          if (!silent) this.syncStatus = 'syncing';

          const callbackName = 'gas_callback_' + Math.round(100000 * Math.random());
          window[callbackName] = (response) => {
            if (response && response.status === 'success' && response.data) {
              const d = response.data;
              if (d.totalBudget) this.totalBudget = d.totalBudget;
              if (d.categories) this.categories = d.categories;
              if (d.expenses) this.expenses = d.expenses;
              if (d.vendors) this.vendors = d.vendors;
              this.syncStatus = 'synced';
              this.updateChart();
            }
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if (scriptEl) scriptEl.remove();
          };

          const script = document.createElement('script');
          script.id = callbackName;
          const separator = this.syncUrl.includes('?') ? '&' : '?';
          script.src = `${this.syncUrl}${separator}callback=${callbackName}&action=get_data&t=${Date.now()}`;
          script.onerror = () => {
            this.syncStatus = 'offline';
            delete window[callbackName];
          };
          document.body.appendChild(script);
        },

        // 推播最新資料至 Google Sheet
        pushDataToCloud() {
          // 先儲存至 LocalStorage
          const payload = {
            totalBudget: this.totalBudget,
            categories: this.categories,
            expenses: this.expenses,
            vendors: this.vendors,
            timestamp: new Date().toISOString()
          };
          localStorage.setItem('mkt_budget_state_2026', JSON.stringify(payload));

          if (!this.syncUrl) return;
          this.syncStatus = 'syncing';

          // 使用 fetch text/plain 搭配 no-cors 模式發送
          fetch(this.syncUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          }).then(() => {
            setTimeout(() => { this.syncStatus = 'synced'; }, 600);
          }).catch(() => {
            this.syncStatus = 'offline';
          });
        },

        forceSyncFromCloud() {
          this.fetchCloudData(false);
        },

        // 預算計算與輔助函式
        formatVND(val) {
          return (val || 0).toLocaleString('en-US') + ' ₫';
        },
        formatNTD(val) {
          const ntd = Math.round((val || 0) / this.rate);
          return 'NT$ ' + ntd.toLocaleString('en-US');
        },
        totalSpent() {
          return this.expenses.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
        },
        remainingBudget() {
          return this.totalBudget - this.totalSpent();
        },
        overallExecutionRate() {
          if (!this.totalBudget) return 0;
          return Math.round((this.totalSpent() / this.totalBudget) * 100);
        },
        getCatAllocatedAmount(cat) {
          return Math.round((this.totalBudget * (cat.percent || 0)) / 100);
        },
        getCatSpent(catId) {
          return this.expenses
            .filter(e => e.category === catId)
            .reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
        },
        getCatProgress(cat) {
          const alloc = this.getCatAllocatedAmount(cat);
          if (!alloc) return 0;
          return Math.round((this.getCatSpent(cat.id) / alloc) * 100);
        },
        getCatName(catId) {
          const c = this.categories.find(x => x.id === catId);
          return c ? (this.lang === 'zh' ? c.name_zh : c.name_en) : catId;
        },

        onSliderChange(changedIndex) {
          this.updateChart();
          this.pushDataToCloud();
        },

        rebalanceEqually() {
          this.categories.forEach(c => c.percent = 20);
          this.updateChart();
          this.pushDataToCloud();
        },

        toggleLanguage() {
          this.lang = this.lang === 'zh' ? 'en' : 'zh';
          this.updateChart();
        },

        // 合約到期檢測 (90 天內)
        getExpiringVendors() {
          const now = new Date();
          return this.vendors.map(v => {
            const end = new Date(v.endDate);
            const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
            return { ...v, daysLeft: diffDays };
          }).filter(v => v.daysLeft <= 90);
        },

        getContractBadge(v) {
          const now = new Date();
          const end = new Date(v.endDate);
          const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
          if (diffDays < 0) return { class: 'bg-rose-100 text-rose-700', text: this.lang === 'zh' ? '已到期' : 'Expired' };
          if (diffDays <= 90) return { class: 'bg-amber-100 text-amber-700', text: this.lang === 'zh' ? `即將到期 (${diffDays}天)` : `Expiring (${diffDays}d)` };
          return { class: 'bg-emerald-100 text-emerald-700', text: this.lang === 'zh' ? '執行中' : 'Active' };
        },

        // 互動操作
        toggleInstallmentStatus(vendor, idx) {
          vendor.installments[idx].paid = !vendor.installments[idx].paid;
          this.pushDataToCloud();
        },
        toggleSingleStatus(vendor) {
          vendor.singlePaid = !vendor.singlePaid;
          this.pushDataToCloud();
        },
        jumpToVendor(vName) {
          this.currentTab = 'vendors';
        },
        deleteExpense(id) {
          this.expenses = this.expenses.filter(e => e.id !== id);
          this.updateChart();
          this.pushDataToCloud();
        },
        deleteVendor(id) {
          this.vendors = this.vendors.filter(v => v.id !== id);
          this.pushDataToCloud();
        },

        // Chart.js
        initChart() {
          const ctx = document.getElementById('budgetPieChart');
          if (!ctx) return;
          this.chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: this.categories.map(c => this.lang === 'zh' ? c.name_zh : c.name_en),
              datasets: [{
                data: this.categories.map(c => c.percent),
                backgroundColor: ['#6366F1', '#EC4899', '#3B82F6', '#10B981', '#F59E0B']
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
            }
          });
        },
        updateChart() {
          if (!this.chartInstance) return;
          this.chartInstance.data.labels = this.categories.map(c => this.lang === 'zh' ? c.name_zh : c.name_en);
          this.chartInstance.data.datasets[0].data = this.categories.map(c => c.percent);
          this.chartInstance.update();
        }
      }
    }
  </script>
</body>
</html>
